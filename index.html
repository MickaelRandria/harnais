/* =====================================================================
   Correction du coach : remplace la « réponse modèle » après chaque réponse.
   PROMPT_COACH = le prompt fourni par l'utilisateur, tel quel (seul le prénom vient du profil).
   FORMAT_COACH = consigne technique ajoutée pour que l'application puisse afficher le retour.
   Sans Gemini : correctionLocale applique les mêmes critères par règles, instantanément.
   ===================================================================== */
const PROMPT_COACH = `Tu es un coach d'entretien pour un poste de Digital Analytics Consultant chez fifty-five. Tu corriges les réponses orales d'un candidat, {PRENOM}, qui a déjà été transcrit à l'écrit. Tu dois être précis, bienveillant et sans complaisance.

## Ce que tu reçois
- La question posée par le manager (technique, CRO ou consulting).
- La réponse du candidat, telle qu'elle a été dite, avec ses hésitations.
- Le cas d'usage attendu, si l'application l'a identifié.

## Ce que tu renvoies
Un retour structuré, en français, sans liste à rallonge :

1. **Verdict en une phrase** : la réponse est-elle bonne, à répéter, ou à passer ? Dis-le d'abord.
2. **Ce qui est juste** : une phrase, sur le fond (méthode, décision, ordre des étapes).
3. **Ce qu'il faut corriger** : trois points maximum, concrets. Chaque point nomme le problème et dit quoi faire à la place.
4. **Version corrigée** : une réponse modèle de 4 à 6 phrases, à l'oral, sans « euh », sans « donc » en début de phrase, avec le plan annoncé et une conclusion.
5. **Décision** : « Répète » (avec la structure à reprendre) ou « Passe ».

## Critères de correction
- **Décision ou priorité** dite dès la première phrase.
- **Plan annoncé** : le nombre d'étapes annoncé doit correspondre au nombre d'étapes énoncées. Compte-les.
- **Ordre logique** : cadrer avant d'auditer, auditer avant de décider, décider avant de suivre.
- **Vérification finale** avant toute présentation de chiffre ou toute mise en production.
- **Conclusion** : une action et un critère de décision.
- **Vocabulaire** : pas de « euh », « donc », « voilà », « sûrement », « en dualité », « mère de sûreté », « Adobe Analytics Fiery 4 ». Pas d'anglicisme quand un mot français existe. Préfère « tableau de bord » à « dashboard ».
- **Précision** : pas de chiffre inventé, pas d'outil inexistant, pas de « Adobe Analytics ou Google Analytics 4 » sans préciser lequel est utilisé chez le client.

## Règles de fond à faire respecter
- **p-value** : c'est le risque d'observer un écart aussi grand par hasard si les versions sont identiques. Ce n'est pas la probabilité que la variante gagne.
- **Seuil de 5 %** : une convention. Un test à p = 0,09 ou 0,11 n'est pas significatif et on ne déploie pas. Un test à p = 0,02 ou 0,04 est significatif, mais on vérifie l'échantillon, les garde-fous (annulations, rendez-vous non honorés) et l'intervalle de confiance avant de déployer, puis on suit l'effet après mise en production.
- **Bots** : ils gonflent surtout le trafic. Ils ne font pas baisser les conversions. Ils peuvent fausser le taux en augmentant le dénominateur.
- **Filtrer le trafic** pour améliorer un taux de conversion : c'est un piège à signaler.
- **Écart outil d'analyse / CRM** : le CRM est la référence. Un écart stable n'est pas forcément juste. Une cassure nette à une date précise est un bug de collecte, traité en priorité.
- **Doublon** : un volume double du CRM signale souvent un événement déclenché deux fois. Vérifier les déclenchements dans TagCommander.
- **Client qui veut un résultat garanti** : ne jamais promettre. Cadrer le chiffre (+1 point sur 3 % = +33 % de conversions), proposer une démarche en étapes, un point d'étape.
- **Baisse de chiffre d'affaires** : décomposer en commandes × panier moyen avant de conclure. Une baisse des commandes ne prouve pas un problème de tracking.
- **Dirigeant** : parler en termes de décision et de délai, pas de jargon. Commencer par la conclusion.
- **Pourquoi le conseil** : une raison positive, un lien avec le parcours, aucune critique de l'employeur actuel.

## Ce que tu ne fais pas
- Tu ne réécris pas la réponse en entier si elle est déjà bonne : tu dis « passe » et tu indiques la seule chose à retenir.
- Tu ne fais pas de débrief global sauf si on te le demande.
- Tu ne donnes aucun nom de personne.
- Tu ne fais pas de liste de plus de trois points par section.
- Tu n'utilises pas de tirets longs dans ta réponse.`;

const FORMAT_COACH = `

## Format technique (imposé par l'application)
Réponds uniquement avec un objet JSON valide, sans texte autour :
{ "verdict": "une phrase", "juste": "une phrase", "corriger": [ { "probleme": "le problème", "action": "quoi faire à la place" } ], "version_corrigee": "4 à 6 phrases, ou chaîne vide si la décision est Passe", "a_retenir": "si Passe : la seule chose à retenir, sinon chaîne vide", "decision": "Répète" ou "Passe", "structure": "si Répète : la structure à reprendre, en une ligne, sinon chaîne vide" }
"corriger" contient 0 à 3 éléments. Si la réponse du candidat est en anglais, rédige "version_corrigee" en anglais ; tout le reste reste en français.`;

function casIdentifie(question, texte){
  const r = chercherCas(question || ""); if(r[0]) return r[0];
  const r2 = chercherCas((question || "") + " " + (texte || "")); return r2[0] || null;
}
async function genererCorrectionCoach(q, question, texte, lang, casForce){
  const prenom = (profil().prenom || "le candidat").trim();
  const systeme = PROMPT_COACH.replace("{PRENOM}", prenom) + FORMAT_COACH;
  const cas = (casForce && METHODES.find(x => x.id === casForce)) || casIdentifie(question, texte);
  const infoCas = cas ? cas.id + " · " + METHODES_FR[METHODES.indexOf(cas)].titre + ". Étapes attendues : " + METHODES_FR[METHODES.indexOf(cas)].etapes.map(e => e[0]).join(", ") + ". Piège : " + (METHODES_FR[METHODES.indexOf(cas)].piege || "") + ". Conclusion attendue : " + (METHODES_FR[METHODES.indexOf(cas)].conclusion || "")
    : (q && q.attendu && q.attendu.length ? "Non identifié parmi les méthodes. Points attendus pour cette question : " + q.attendu.map(a => a.point).join(", ") : "Non identifié");
  const contenu = "Question posée par le manager : " + question + "\nRéponse du candidat (transcription) : " + texte + "\nCas d'usage attendu : " + infoCas;
  const { obj, modele } = await geminiJSON(systeme, [{ role:"user", parts:[{ text:contenu }] }], { temperature:0.4, priorite:"basse", rapide:true });
  if(!obj || typeof obj.verdict !== "string" || !obj.verdict.trim()) throw new ErrGem("json", "Correction vide renvoyée par Gemini.");
  const dec = /passe/i.test(String(obj.decision || "")) ? "Passe" : "Répète";
  return { source:"gemini", modele, coach:true, decision:dec, verdict:sansTiret(obj.verdict.trim()), juste:sansTiret(String(obj.juste || "").trim()),
    corriger:(Array.isArray(obj.corriger) ? obj.corriger : []).slice(0, 3).map(c => ({ p:sansTiret(String((c && c.probleme) || "").trim()), a:sansTiret(String((c && c.action) || "").trim()) })).filter(c => c.p || c.a),
    texte:sansTiret(String(obj.version_corrigee || "").trim()), aRetenir:sansTiret(String(obj.a_retenir || "").trim()), structure:sansTiret(String(obj.structure || "").trim()), cas: cas ? cas.id : null, pourquoi:[] };
}

/* Correction locale par règles (instantanée) : mêmes critères que le prompt, version corrigée = réponse type du cas */
const MOTS_A_BANNIR = [["euh","euh","rien, une courte pause"],["voila","voilà","rien, termine ta phrase"],["surement","sûrement","« probablement » ou un fait vérifié"],["en dualite","en dualité","« en parallèle » ou « en comparaison »"],["mere de surete","mère de sûreté","« marge de sécurité »"],["fiery","Fiery","le nom exact de l'outil (Adobe Analytics)"],["dashboard","dashboard","« tableau de bord »"]];
function correctionLocale(q, question, texte, ev, lang, casForce){
  ev = ev || {};
  const n = norm(texte || ""), en = lang === "en", ph = phrases(texte || ""), nw = mots(texte || "").length;
  const cas = (casForce && METHODES.find(x => x.id === casForce)) || casIdentifie(question, texte), pts = [];
  /* Règles de fond */
  if(/chances? de gagner|probabilite que la variante|% de chance|chance of winning/.test(n)) pts.push({ p:"p-value mal définie.", a:"Dis : c'est le risque d'observer un écart aussi grand par hasard si les versions sont identiques, pas la probabilité que la variante gagne." });
  if(/\bbots?\b/.test(n) && /(baisse|chute|drop|lower)/.test(n) && /conversion/.test(n)) pts.push({ p:"Bots mal placés.", a:"Les bots gonflent surtout le trafic ; ils ne font pas baisser les conversions, ils peuvent seulement fausser le taux par le dénominateur." });
  if(/filtr\w*\s+(le\s+|du\s+)?trafic/.test(n)) pts.push({ p:"Filtrer le trafic pour améliorer le taux.", a:"Signale-le comme un piège : ça embellit l'indicateur sans changer la réalité." });
  if(/(je vous garantis|je garantis|on garantit|je promets|i guarantee|we guarantee)/.test(n)) pts.push({ p:"Promesse de résultat.", a:"Ne promets jamais : cadre le chiffre, propose une démarche en étapes et un point d'étape." });
  if(/adobe/.test(n) && /(ga4|google analytics)/.test(n) && /\bou\b|\bor\b/.test(n)) pts.push({ p:"Outil imprécis.", a:"Précise l'outil réellement utilisé chez le client, au lieu de « Adobe Analytics ou GA4 »." });
  /* Plan annoncé et étapes énoncées */
  const NB = { un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,two:2,three:3,four:4,five:5,seven:7,eight:8 };
  const m = n.match(/\b(?:en|in)\s+(\d|un|une|deux|trois|quatre|cinq|six|sept|huit|two|three|four|five|seven|eight)\s+(?:etapes|points|temps|steps|parts)\b/);
  const marqueurs = (n.match(/\b(d'abord|premierement|ensuite|deuxiemement|puis|troisiemement|enfin|finalement|first|firstly|secondly|then|thirdly|finally)\b/g) || []).length;
  if(m){ const annonce = NB[m[1]] || Number(m[1]); if(marqueurs && Math.abs(marqueurs - annonce) >= 1) pts.push({ p:"Plan annoncé : "+annonce+" étapes, mais "+marqueurs+" énoncées.", a:"Compte tes étapes : le nombre annoncé doit correspondre à ce que tu déroules." }); }
  else if(nw >= 40) pts.push({ p:"Pas de plan annoncé.", a:"Annonce ta décision ou ta priorité, puis ton plan, dès la première phrase : « Je procède en N étapes : … »." });
  /* Conclusion */
  const derniere = norm(ph[ph.length - 1] || "");
  if(nw >= 25 && !/(pour conclure|en resume|au final|ce que je retiens|je recommande|ma recommandation|la decision|to sum up|in short|i'd recommend|so overall|my recommendation)/.test(derniere)) pts.push({ p:"Pas de conclusion.", a:"Termine par une action et un critère de décision." });
  /* Vocabulaire */
  const voc = MOTS_A_BANNIR.filter(([w]) => new RegExp("\\b" + w + "\\b").test(n)).map(([w, lib, alt]) => "« " + lib + " » (dis plutôt " + alt + ")");
  if(ph.some(p => /^donc\b/.test(norm(p).trim()))) voc.push("« donc » en début de phrase (commence directement par l'idée)");
  if(voc.length) pts.push({ p:"Vocabulaire.", a:"À retirer : " + voc.slice(0, 3).join(", ") + "." });
  const nbFond = pts.filter(x => /p-value|Bots|Filtrer|Promesse|Outil/.test(x.p)).length;
  if(nw < 40) pts.push({ p:"Réponse trop courte ("+nw+" mots).", a:"Développe : décision, plan annoncé, chaque étape en une phrase, conclusion." });
  /* La décision suit les critères du coach, pas la note générique de l'application */
  const passe = !pts.length;
  const verdict = passe ? "Bonne réponse : passe." : nbFond ? "Erreur de fond : à répéter." : "Le fond tient, mais la forme est à reprendre : à répéter.";
  const rt = cas && REPONSES_TYPES[cas.id] ? REPONSES_TYPES[cas.id][en ? "en" : "fr"] : "";
  const trame = rt || (reponseModeleLocale(q, question, lang) || {}).texte || "";
  return { source:"local", coach:true, decision: passe ? "Passe" : "Répète", verdict, juste: (voc.length && /tic|clair/i.test(ev.point_fort || "")) ? (cas ? "Tu traites le bon sujet : " + (cas.court.charAt(0).toLowerCase() + cas.court.slice(1)) + "." : "Tu restes sur le sujet de la question.") : (ev.point_fort || ""),
    corriger: pts.slice(0, 3), texte: passe ? "" : trame,
    aRetenir: passe ? "Garde cette structure : décision d'abord, plan annoncé et tenu, conclusion avec une action." : "",
    structure: passe ? "" : (cas ? annonceMethode(cas) : "Décision ou priorité, plan annoncé, étapes dans l'ordre, vérification, conclusion."),
    cas: cas ? cas.id : null, pourquoi:[] };
}

function rendreCorrectionQC(r){ return blocCoach(r, "qc", "qc").replace(/data-action="ecouterModele"/g, 'data-action="ecouterCorrectionQC"'); }
function brancherEntrainementQC(){
  const t = $("#qc-rep"); if(!t) return;

async function corrigerReponseQC(){
  const m = METHODES.find(x => x.id === QC.affiche), t = $("#qc-rep"), z = $("#qc-correction");
  if(!m || !t || !z) return;
  const texte = t.value.trim(); if(!texte){ toast("Écris ou dicte d'abord ta réponse."); t.focus(); return; }
  if(VOIX.ecoute) VOIX.arreter();
  const f = FICHES[m.id] || {}, lang = langueMeth() === "en" ? "en" : "fr";
  const question = lang === "en" ? (f.qEn || m.titre) : (f.qFr || m.titre);
  const ev = evaluerLocal(texte, null, { lang });
  let r;
  if(geminiActif()){
    z.innerHTML = '<p class="muet">Correction en cours par Gemini...</p>';
    try{ r = await genererCorrectionCoach(null, question, texte, lang, m.id); }
    catch(e){ r = correctionLocale(null, question, texte, ev, lang, m.id); r.erreur = (e && e.message) || "Gemini indisponible."; }
  } else r = correctionLocale(null, question, texte, ev, lang, m.id);
  r.cas = m.id; QC.correction = r;
  if(QC.affiche === m.id && $("#qc-correction")){ $("#qc-correction").innerHTML = rendreCorrectionQC(r); defilerVers($("#qc-correction"), "nearest"); }
}

Object.assign(ACTIONS, {

    if(VOIX.ecoute){ VOIX.arreter(); setTimeout(majMicroQC, 150); return; }
    if(!VOIX.dispo){ toast("Reconnaissance vocale indisponible sur ce navigateur : réponds à l'écrit."); return; }
    const R = reglages(), lang = langueMeth() === "en" ? (R.langueEn || "en-GB") : (R.langue || "fr-FR");
    VOIX.reinit(t.value);
    VOIX.onMaj = x => { const z = $("#qc-rep"); if(z){ z.value = x; QC.rep[QC.affiche] = x; } };
    VOIX.onFin = () => majMicroQC();
    VOIX.onErreur = c => { majMicroQC(); if(c !== "no-speech") toast("Micro : " + (c === "not-allowed" ? "autorise le micro dans le navigateur." : c)); };
    VOIX.demarrer(lang); majMicroQC();

    const mc = String(e[1]||"").split("|").filter(Boolean).map(k => '<span class="puce">'+esc(k)+'</span>').join("");
    return '<li class="etape"><button class="etape-btn" data-action="etapeMethode" aria-expanded="false">'+
      '<span class="etape-num" aria-hidden="true">'+(i+1)+'</span><span class="etape-corps">'+
      '<span class="etape-titre"><span class="sr">Étape '+(i+1)+' : </span>'+esc(e[0])+'</span>'+
      '<span class="etape-cache">Touche pour révéler les mots-clés</span>'+
      '<span class="puces etape-mc">'+mc+'</span>'+
      '<span class="etape-dev">'+esc(e[2]||"")+'</span>'+
      (noteEtape(m.id, i) ? '<span class="etape-note"><b>Ma note :</b> '+esc(noteEtape(m.id, i))+'</span>' : "")+'</span></button></li>';
  }).join("");
  ouvrirModale('<div class="feuille-meth'+(revision ? " revision" : "")+'" data-id="'+m.id+'">'+
    '<div class="ligne-titre"><span class="etiquette"><span class="anneau"></span>'+esc(f.nom)+' · '+m.id+'</span>'+
      '<button class="btn-icone" data-action="fermerFeuille" aria-label="Fermer">'+ic("retour")+'</button></div>'+
    '<h2>'+esc(m.titre)+'</h2>'+
    blocQuestionFiche(m)+blocPlanFiche(m)+
    '<div class="annonce-meth"><p>« '+esc(annonceMethode(m))+' »</p>'+
      '<button class="btn btn-petit" data-action="copierAnnonce" data-arg="'+m.id+'">'+ic("copier")+tr("copierAnnonce")+'</button>'+'<button class="btn btn-petit" data-action="ecouterAnnonce" data-arg="'+m.id+'">'+ic("lecture")+tr("ecouter")+'</button>'+'</div>'+
    (revision ? '<p class="muet petit">Mode révision : récite les mots-clés de chaque étape, puis touche-la pour vérifier.</p>' : '<p class="muet petit">Touche une étape pour lire sa phrase de développement.</p>')+
    '<ol class="stepper">'+etapes+'</ol>'+
    blocPiegesFiche(m)+blocServerSideCas(m)+
    '<div class="fb-bloc ton-vert"><h4>'+ic("drapeau")+tr("conclusion")+'</h4><p>« '+esc(m.conclusion||"")+' »</p></div>'+
    blocReponseType(m, false)+blocMotsFiche(m)+
    '<div class="flex actions-meth"><button class="btn" data-action="revisionMethode" aria-pressed="'+(!!revision)+'">'+ic("oeil")+(revision ? "Quitter le mode révision" : "Mode révision")+'</button>'+
      '<button class="btn '+(fait ? "" : "btn-bleu")+'" data-action="marquerMethode" aria-pressed="'+fait+'">'+ic("coche")+(fait ? "Révisé, annuler" : "Marquer révisé")+'</button></div>'+
  '</div>');
  const h = $("#modale-boite h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus(); }
}
Object.assign(ACTIONS, {
  ouvrirQuelCas(){ go("quelcas"); },
  ouvrirMethode(el){ feuilleMethode(el.dataset.arg, false); },
  fermerFeuille(){ fermerModale(); },
  etapeMethode(el){
    const li = el.closest(".etape"), rev = !!el.closest(".revision");
    const cls = rev ? "revele" : "ouvert", on = !li.classList.contains(cls);
    li.classList.toggle(cls, on); el.setAttribute("aria-expanded", String(on));
  },
  copierAnnonce(el){ const m = METHODES.find(x => x.id === el.dataset.arg); if(m) copier(annonceMethode(m)); },
  revisionMethode(){ const f = $(".feuille-meth"); if(f) feuilleMethode(f.dataset.id, !f.classList.contains("revision")); },
  marquerMethode(){
    const f = $(".feuille-meth"); if(!f) return;
    const id = f.dataset.id, o = methodesFaites();
    if(o[id]) delete o[id]; else o[id] = new Date().toISOString();
    store.set("methodes", o);
    if(o[id]) toast("Méthode marquée révisée.");
    feuilleMethode(id, f.classList.contains("revision"));
    if(nomRoute() === "methodes") rMethodes();
  }
});
init();
/* PWA : service worker (installation sur l'écran d'accueil, ouverture hors ligne). Ignoré si la page est ouverte en fichier local. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").then(r => { try{ r.update(); }catch(e){} }).catch(() => {}); });
}
</script>
