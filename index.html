<!doctype html>
<html lang="fr" data-theme="jour">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harnais</title>
<meta name="description" content="Harnais, entraînement aux entretiens de Digital Analytics Consultant.">
<meta name="theme-color" content="#0E1A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harnais">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1A3D'/%3E%3Cpath d='M4 26 L13 12 L18 19 L22 14 L28 26Z' fill='%23F2A25C'/%3E%3Ccircle cx='23' cy='8' r='3' fill='%23F6E7B8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bleu:#1F6FE0; --bleu-fonce:#1659B8; --marine:#0E1A3D; --orange:#F2A25C; --vert:#4CD964; --rouge:#E5484D;
  --r:18px; --font:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; --fs:16px;
}
html[data-theme="jour"]{
  --page1:#DCE7F7; --page2:#C7D9F2; --disque:#8DB1E2;
  --fond:#EEF3FB; --fond2:#E1E9F6;
  --txt:#0E1A3D; --txt2:#3F4C74; --txt3:#56628A;
  --verre:rgba(255,255,255,.7); --verre-bord:rgba(255,255,255,.95); --carte:#FFFFFF;
  --ligne:rgba(14,26,61,.13); --orange-txt:#9E4B08; --vert-txt:#17702F; --rouge-txt:#B42318;
  --bulle-m:#0E1A3D; --nav:#0E1A3D; --champ:#FFFFFF; --ombre:0 8px 24px rgba(14,26,61,.10);
  --hero-txt:#0E1A3D;
}
html[data-theme="nuit"], .force-nuit{
  --page1:#1A2352; --page2:#0C1233; --disque:#2A3A7C;
  --fond:#111A43; --fond2:#0C1233;
  --txt:#FFFFFF; --txt2:#CDD4F0; --txt3:#AEB8DE;
  --verre:rgba(255,255,255,.14); --verre-bord:rgba(255,255,255,.2); --carte:#1B2557;
  --ligne:rgba(255,255,255,.16); --orange-txt:#F7B77A; --vert-txt:#7BE896; --rouge-txt:#FFA3A6;
  --bulle-m:#26316A; --nav:#0A1230; --champ:#18214D; --ombre:0 8px 24px rgba(0,0,0,.35);
  --hero-txt:#FFFFFF;
}
.force-nuit{background:var(--fond);color:var(--txt)}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html.taille-grand{--fs:18px}
html.taille-bus{--fs:20px}
html.taille-bus *, html.taille-bus *::before, html.taille-bus *::after{animation-duration:0s!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition:none!important}}
body{margin:0;font-family:var(--font);font-size:1rem;line-height:1.5;color:var(--txt);background:linear-gradient(160deg,var(--page1),var(--page2)) fixed;min-height:100vh}
h1,h2,h3{font-weight:700;margin:0;line-height:1.2;letter-spacing:-.01em}
h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.4em 0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #FFB547;outline-offset:2px;border-radius:8px}
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor .disque{position:absolute;width:620px;height:620px;border-radius:50%;background:var(--disque);top:-300px;right:-200px}
.decor svg{position:absolute;fill:#fff;opacity:.9}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--fond);display:flex;flex-direction:column;overflow:clip;color:var(--txt)}
@media (min-width:600px) and (min-height:561px){#app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:36px;box-shadow:0 30px 80px rgba(14,26,61,.28)}}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.ic{width:24px;height:24px;flex:none}
.nav{position:sticky;bottom:0;z-index:30;background:var(--nav);display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0}
.nav button{background:none;border:0;color:#fff;width:64px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;border-radius:14px;opacity:.85}
.nav button[aria-current="page"]{opacity:1}
.nav .point{width:6px;height:6px;border-radius:50%;background:transparent}
.nav button[aria-current="page"] .point{background:var(--orange)}
.nav .ic{width:26px;height:26px}
.cache{display:none!important}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid var(--ligne);background:var(--verre);color:var(--txt);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn-bleu{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn-bleu:hover{background:var(--bleu-fonce)}
.btn-danger{background:transparent;border-color:var(--rouge);color:var(--rouge-txt)}
.btn-petit{min-height:44px;padding:8px 12px;font-size:.95rem}
.btn-bloc{width:100%}
.btn-rond{width:56px;height:56px;border-radius:50%;border:0;background:var(--bleu);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(31,111,224,.4);flex:none}
.btn-carre{width:52px;height:52px;border-radius:14px;border:0;background:var(--bleu);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.btn-icone{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.btn[disabled],button[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);color:var(--txt);font-weight:600;font-size:1rem}
button.chip{cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff}
.verre{background:var(--verre);border:1px solid var(--verre-bord);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.carte{border-radius:var(--r);padding:16px;background:var(--carte);border:1px solid var(--ligne);box-shadow:var(--ombre)}
.carte.verre{background:var(--verre);border-color:var(--verre-bord)}
.etiquette{display:inline-flex;align-items:center;gap:8px;color:var(--orange-txt);font-weight:600;font-size:1rem}
.etiquette .anneau{width:14px;height:14px;border-radius:50%;border:3px solid var(--orange)}
.muet{color:var(--txt2)}
.petit{font-size:.9rem}
.contenu{padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px}
.ligne-titre{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pile{display:flex;flex-direction:column;gap:12px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* hero */
.hero{position:relative;min-height:330px;overflow:hidden;color:var(--hero-txt)}
.hero>svg.paysage{position:absolute;inset:0;width:100%;height:100%}
.hero-haut{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:28px 16px 0 20px}
.hero h1{font-size:2.3rem;font-weight:800;letter-spacing:-.02em}
.hero .date{font-weight:600;margin-top:4px;opacity:.9}
.hero-corps{position:relative;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
html[data-theme="jour"] .hero .chip{background:rgba(255,255,255,.75)}
.aujourdhui{color:var(--txt)}
.aujourdhui .titre{font-weight:700;font-size:1.1rem}
.rangee{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.rangee{scrollbar-width:none}.rangee::-webkit-scrollbar{display:none}
.rangee .tuile-act{scroll-snap-align:start;flex:0 0 240px}
.tuile-act{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:var(--r);background:var(--carte);border:1px solid var(--ligne);cursor:pointer;color:var(--txt);box-shadow:var(--ombre);min-height:88px}
.tuile-act .ic{width:34px;height:34px;color:var(--bleu)}
html[data-theme="nuit"] .tuile-act .ic{color:#9CC2FF}
.tuile-act strong{display:block;font-size:1.05rem}
.tuile-act span{color:var(--txt2);font-size:.95rem}
.badge-serie{display:flex;gap:10px;flex-wrap:wrap}

/* frise */
.frise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.frise li{position:relative;display:flex;gap:14px;align-items:center;padding:10px 0}
.frise li:not(:last-child)::after{content:"";position:absolute;left:27px;top:62px;bottom:-14px;width:2px;background:var(--ligne)}
.frise button.item{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;cursor:pointer;border-radius:16px;padding:4px}
.frise button.item:focus-visible{outline:3px solid #FFB547}
.pastille{position:relative;width:56px;height:56px;border-radius:50%;background:var(--bleu);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 0 0 6px rgba(31,111,224,.18)}
.pastille .etat{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--fond)}
.etat.en-cours{background:var(--vert)} .etat.fait{background:#fff}
.frise .nom{font-weight:700;font-size:1.1rem}
.frise .statut{font-size:.95rem;color:var(--txt2)}
.frise .duree{margin-left:auto;font-weight:600;color:var(--txt2);white-space:nowrap}

/* session */
.session{display:flex;flex-direction:column;height:100vh;height:100dvh}
@media (min-width:600px) and (min-height:561px){.session{height:calc(100vh - 48px)}}
.sess-haut{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;background:var(--fond2);border-bottom:1px solid var(--ligne)}
.sess-titre{flex:1;min-width:0}
.sess-titre .role{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-titre .phase{color:var(--txt2);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minuteur{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;background:var(--marine);color:#fff;border:0;border-radius:12px;min-height:44px;padding:6px 12px;cursor:pointer}
.minuteur.alerte{background:#B54708}
.minuteur.en-pause{background:#555E80}
.defi{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:.95rem;color:var(--txt2);background:var(--fond2)}
.barre{flex:1;height:10px;border-radius:999px;background:var(--ligne);overflow:hidden}
.barre i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),#62A0FF);border-radius:999px;transition:width .5s}
.fil{flex:1;overflow-y:auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:12px}
.bulle{max-width:88%;padding:12px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.bulle.m{align-self:flex-start;background:var(--bulle-m);color:#fff;border-bottom-left-radius:6px}
.bulle.c{align-self:flex-end;background:var(--bleu);color:#fff;border-bottom-right-radius:6px}
.bulle.sys{align-self:center;background:transparent;color:var(--txt2);font-size:.95rem;text-align:center;padding:4px 8px}
.bulle .qui{display:block;font-size:.85rem;font-weight:700;opacity:.85;margin-bottom:2px}
.ecrit{align-self:flex-start;color:var(--txt2);padding:4px 8px}
.ecrit span{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:4px;animation:rebond 1s infinite}
.ecrit{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.ecrit-txt{font-style:normal;font-size:.95rem;margin:0 8px}
.ecrit span:nth-child(2){animation-delay:.15s}.ecrit span:nth-child(3){animation-delay:.3s}
@keyframes rebond{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
.sess-bas{border-top:1px solid var(--ligne);background:var(--fond2);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.zone-saisie{display:flex;gap:8px;align-items:flex-end}
.zone-saisie textarea{flex:1;min-height:52px;max-height:30vh;resize:vertical;border-radius:14px;border:1px solid var(--ligne);background:var(--champ);padding:12px;font-size:1rem;line-height:1.4}
.actions-sess{display:flex;justify-content:space-between;align-items:center;gap:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--txt);cursor:pointer;min-width:52px;min-height:52px;border-radius:12px;font-size:.85rem;font-weight:600;padding:4px}
.act[aria-pressed="true"]{color:var(--bleu)}
html[data-theme="nuit"] .act[aria-pressed="true"]{color:#8DB8FF}
.micro{width:76px;height:76px;border-radius:50%;border:0;background:var(--bleu);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(31,111,224,.45);touch-action:none;-webkit-user-select:none;user-select:none}
.micro .ic{width:34px;height:34px}
.micro.ecoute{background:#D92D20;box-shadow:0 0 0 8px rgba(217,45,32,.2)}
.onde{display:flex;gap:4px;justify-content:center;align-items:center;height:26px}
.onde i{width:4px;height:6px;border-radius:2px;background:var(--bleu);opacity:.35}
.onde.active i{opacity:1;animation:onde .9s ease-in-out infinite}
.onde i:nth-child(2){animation-delay:.1s}.onde i:nth-child(3){animation-delay:.2s}.onde i:nth-child(4){animation-delay:.3s}.onde i:nth-child(5){animation-delay:.4s}.onde i:nth-child(6){animation-delay:.25s}.onde i:nth-child(7){animation-delay:.15s}
@keyframes onde{0%,100%{height:6px}50%{height:24px}}
.info-voix{font-size:.9rem;color:var(--txt2);text-align:center}
.chrono-rep{align-self:center;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:999px;background:var(--verre);border:1px solid var(--ligne)}
.chrono-rep.alerte{color:#fff;background:#B54708}

/* feedback */
.fb{align-self:stretch;border-radius:var(--r);background:var(--carte);border:1px solid var(--ligne);padding:0;box-shadow:var(--ombre);margin:6px 0 10px;overflow:hidden}
.fb summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.fb summary::-webkit-details-marker{display:none}
.fb .source{font-size:.85rem;color:var(--txt2);font-weight:500}
.fb p{margin:0}
.fb-tete{padding:16px 18px}
.fb[open] .fb-tete{border-bottom:1px solid var(--ligne)}
.fb-note{flex:none;display:inline-flex;align-items:baseline;justify-content:center;min-width:72px;padding:8px 12px;border-radius:14px;font-size:1.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.fb-note small{font-size:.85rem;font-weight:700;opacity:.8;margin-left:2px}
.n-bon{background:rgba(76,217,100,.18);color:var(--vert-txt)}
.n-moyen{background:rgba(242,162,92,.2);color:var(--orange-txt)}
.n-faible{background:rgba(229,72,77,.15);color:var(--rouge-txt)}
.fb-titre{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fb-titre b{font-size:1.05rem}
.fb-chevron{width:10px;height:10px;border-right:2px solid var(--txt2);border-bottom:2px solid var(--txt2);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
.fb[open] .fb-chevron{transform:rotate(-135deg);margin-bottom:-4px}
.fb-corps{padding:18px;display:flex;flex-direction:column;gap:16px}
.fb-bloc{display:flex;flex-direction:column;gap:8px;line-height:1.6}
.fb-bloc h4{display:flex;align-items:center;gap:8px;margin:0;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2)}
.fb-bloc h4 .ic{width:18px;height:18px}
.fb-bloc h4 .source{text-transform:none;letter-spacing:0;font-weight:600;margin-left:auto}
.ton-vert,.ton-orange,.ton-bleu{padding:14px 16px;border-radius:14px}
.ton-vert{background:rgba(76,217,100,.12);border:1px solid rgba(76,217,100,.35)}
.ton-vert h4{color:var(--vert-txt)}
.ton-orange{background:rgba(242,162,92,.14);border:1px solid rgba(242,162,92,.45)}
.ton-orange h4{color:var(--orange-txt)}
.ton-bleu{background:rgba(31,111,224,.09);border:1px solid rgba(31,111,224,.35)}
.ton-bleu h4{color:var(--bleu)}
html[data-theme="nuit"] .ton-bleu h4,.force-nuit .ton-bleu h4{color:#9CC2FF}
.criteres{display:grid;gap:12px}
.crit{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.crit-l{display:flex;justify-content:space-between;gap:8px}
.crit .barre{flex:none;height:8px}
.critere{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:.95rem}
.critere .barre{height:8px}
.critere b{text-align:right}
.rm{display:flex;flex-direction:column;gap:10px}
.rm-vide{align-items:flex-start}
.rm-texte{line-height:1.7;font-size:1.02rem}
.rm .prose{padding-left:1.2em}
.rep-deb{box-shadow:none;margin:0}
.rep-deb>summary{padding:14px 16px}
.rep-deb>div,.rep-deb>.rm{margin:0 16px 16px}
.rep-deb summary span:first-child{font-weight:600}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{font-size:.9rem;padding:4px 10px;border-radius:999px;background:rgba(242,162,92,.18);border:1px solid rgba(242,162,92,.5)}
.puce.ok{background:rgba(76,217,100,.15);border-color:rgba(76,217,100,.5)}
.jauge{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,#9DB7E6 0%,#9DB7E6 37.5%,#4CD964 37.5%,#4CD964 62.5%,#F2C14E 62.5%,#F2C14E 75%,#F2A25C 75%,#F2A25C 100%)}
.jauge i{position:absolute;top:-4px;width:4px;height:20px;background:var(--txt);border-radius:2px}
.xp-gain{font-weight:700;color:var(--vert-txt)}

/* progression */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bento .tuile{border-radius:16px;padding:14px;background:var(--carte);border:1px solid var(--ligne);min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.bento .tuile.large{grid-column:span 2}
.bento .val{font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bento .lib{font-size:.95rem;color:var(--txt2)}
.graph{width:100%;height:auto;display:block}
.graph text{fill:var(--txt2);font-size:12px;font-family:var(--font)}
.chaleur{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chaleur div{border-radius:10px;padding:10px 8px;font-size:.9rem;font-weight:600;min-height:62px;display:flex;flex-direction:column;justify-content:space-between}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border-radius:14px;padding:10px;border:1px dashed var(--ligne);color:var(--txt3);font-size:.95rem;display:flex;gap:8px;align-items:center}
.badge.obtenu{border-style:solid;color:var(--txt);background:rgba(242,162,92,.14);border-color:rgba(242,162,92,.6)}
.badge .ic{width:22px;height:22px}
.badge.obtenu .ic{color:var(--orange)}
table.tab{width:100%;border-collapse:collapse;font-size:.95rem}
.tab th,.tab td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ligne);vertical-align:top}

/* modules */
.grille-mod{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grille-mod button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:16px;background:var(--carte);border:1px solid var(--ligne);color:var(--txt);cursor:pointer;min-height:110px}
.grille-mod .ic{color:var(--bleu);width:28px;height:28px}
html[data-theme="nuit"] .grille-mod .ic{color:#9CC2FF}
.grille-mod strong{font-size:1.02rem}
.grille-mod span{color:var(--txt2);font-size:.9rem}
.entete{display:flex;align-items:center;gap:8px;padding:16px 12px 4px}
.entete h1{font-size:1.6rem;font-weight:800}
.liste-q{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.liste-q li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px;border-radius:14px;background:var(--carte);border:1px solid var(--ligne)}
.tag{display:inline-block;font-size:.85rem;padding:2px 8px;border-radius:999px;border:1px solid var(--ligne);color:var(--txt2);margin-right:4px}

/* formulaires */
label.champ{display:flex;flex-direction:column;gap:6px;font-weight:600}
.champ input,.champ select,.champ textarea,input.mini,select.mini{min-height:44px;border-radius:12px;border:1px solid var(--ligne);background:var(--champ);padding:8px 12px;font-weight:500;font-size:1rem;width:100%}
.champ textarea{min-height:90px}
.champ small{font-weight:500;color:var(--txt2)}
.interrupteur{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-weight:600}
.interrupteur input{width:24px;height:24px;flex:none;accent-color:var(--bleu)}
.groupe{display:flex;flex-direction:column;gap:12px}
.avert{border-left:4px solid var(--orange);padding:10px 12px;background:rgba(242,162,92,.12);border-radius:8px}

/* atelier */
.atelier{overflow-x:auto;margin:0 -16px;padding:0 16px}
.atelier table{border-collapse:collapse;min-width:900px;font-size:.95rem}
.atelier th,.atelier td{border-bottom:1px solid var(--ligne);padding:6px;text-align:left;vertical-align:top}
.atelier input,.atelier select,.atelier textarea{width:100%;min-height:40px;border-radius:8px;border:1px solid var(--ligne);background:var(--champ);padding:6px 8px;font-size:.95rem}
.atelier textarea{min-height:60px}
.msgs-valid li{margin:4px 0}
.msg-err{color:var(--rouge-txt)} .msg-ok{color:var(--vert-txt)}

/* flashcards */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;font-size:1.2rem}
.flash .recto{font-weight:800;font-size:1.4rem}

/* modale, toast */
.modale{position:fixed;inset:0;z-index:100;background:rgba(6,10,30,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:600px){.modale{align-items:center;padding:20px}}
.modale .boite{background:var(--fond);color:var(--txt);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.modale .boite{border-radius:24px}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:200;background:#0E1A3D;color:#fff;padding:12px 16px;border-radius:14px;max-width:min(440px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:600}
.toast:empty{display:none}
.debrief-score{font-size:3rem;font-weight:800;line-height:1}
.prose ul{margin:.3em 0;padding-left:1.2em}
.prose li{margin:.25em 0}
.poche h3{margin-top:4px}
/* session : structure (mobile d'abord) */
.sess-corps{flex:1;min-height:0;display:flex;flex-direction:column}
.sess-gauche{flex:1;min-height:0;display:flex;flex-direction:column}
.panneau{display:none}
.fil{gap:16px;padding:18px 14px 24px}
.fil>*{flex-shrink:0}
.actions-sess{max-width:560px;width:100%;margin:0 auto}
.bulle{padding:14px 16px;line-height:1.55}
.fb-lien{align-self:flex-end;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--ligne);background:var(--carte);color:var(--txt);font-weight:600;cursor:pointer;margin-top:-6px}
.fb-lien .ic{width:18px;height:18px;color:var(--bleu)}
.fb-lien[aria-pressed="true"]{border-color:var(--bleu);box-shadow:0 0 0 2px rgba(31,111,224,.25)}
.nav-marque{display:none}
.nav .lib{display:none}
.contenu{gap:20px;padding:12px 18px 32px}
.carte{padding:18px}

/* ---------- Grand écran : vraie web app ---------- */
@media (min-width:1024px){
  .decor{display:none}
  body{background:var(--fond)}
  #app{max-width:none;margin:0;min-height:100vh;border-radius:0;box-shadow:none;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-areas:"nav main";align-items:start}
  #app.plein{grid-template-columns:minmax(0,1fr);grid-template-areas:"main"}
  main{grid-area:main;min-height:100vh}
  .nav{grid-area:nav;position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;padding:28px 16px;border-radius:0}
  .nav-marque{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:1.3rem;padding:4px 12px 24px}
  .nav-marque svg{width:34px;height:34px}
  .nav button{width:100%;flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 16px;min-height:52px;font-weight:600;font-size:1rem}
  .nav button:hover{background:rgba(255,255,255,.06)}
  .nav button[aria-current="page"]{background:rgba(255,255,255,.12)}
  .nav .lib{display:inline}
  .nav .point{margin-left:auto}
  .entete{padding:36px 48px 8px}
  .entete h1{font-size:2rem}
  .contenu{padding:20px 48px 56px;gap:24px;max-width:1240px}
  .carte{padding:24px}
  .hero{min-height:400px}
  .hero-haut{padding:40px 48px 0}
  .hero h1{font-size:2.8rem}
  .hero-corps{padding:20px 48px 36px;max-width:640px}
  .rangee{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));overflow:visible;margin:0;padding:4px 0}
  .rangee .tuile-act{flex:none}
  .grille-mod{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .grille-mod button{padding:20px;min-height:140px}
  .bento{grid-template-columns:repeat(4,1fr);gap:16px}
  .chaleur{grid-template-columns:repeat(3,1fr)}
  .carte .graph{max-width:460px;margin:0 auto}
  .grille-desk{display:block;column-count:2;column-gap:24px}
  .grille-desk>*{break-inside:avoid;margin:0 0 24px;width:100%}
  .grille-desk>.pleine{column-span:all}
  .frise{max-width:760px}
  .modale .boite{max-width:620px;padding:28px}
  .toast{bottom:32px}
  /* session en deux colonnes : conversation à gauche, retours à droite */
  .session{height:100vh}
  .sess-haut{padding:16px 28px}
  .defi{padding:10px 28px}
  .sess-corps{flex-direction:row}
  .sess-gauche{border-right:1px solid var(--ligne)}
  .fil{padding:28px 40px 32px;gap:18px}
  .fil .bulle{max-width:76%;font-size:1.05rem}
  .sess-bas{padding:16px 40px 20px}
  .zone-saisie textarea{min-height:64px}
  .panneau{display:block;flex:0 0 clamp(400px,36vw,560px);overflow-y:auto;padding:28px 28px 40px;background:var(--fond2)}
  .panneau .fb{margin:0;box-shadow:none}
  .panneau-tete{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .panneau-q{font-weight:700;font-size:1.1rem;line-height:1.45;margin:0}
  .panneau-rep{margin:0 0 16px;border-radius:14px;border:1px solid var(--ligne);background:var(--carte);padding:12px 16px}
  .panneau-rep summary{cursor:pointer;font-weight:600;color:var(--txt2)}
  .panneau-rep p{margin:10px 0 2px;line-height:1.6}
  .panneau-vide{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:32px 8px;color:var(--txt)}
  .panneau-vide>.ic{width:40px;height:40px;color:var(--bleu)}
}
@media (min-width:1500px){
  .fil{padding-left:64px;padding-right:64px}
  .sess-bas{padding-left:64px;padding-right:64px}
}
/* ---------- Présentation ---------- */
@media (max-width:1023px){ .nav button[data-go="presentation"]{display:none} }
.pitch{display:flex;flex-direction:column;gap:12px}
.pitch h2,.projets-pres h2{display:flex;align-items:center;gap:10px}
.pitch-total{font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(76,217,100,.16);color:var(--vert-txt);white-space:nowrap}
.pitch-total.trop-long{background:rgba(242,162,92,.2);color:var(--orange-txt)}
.pitch-bloc{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--fond2);border:1px solid var(--ligne)}
.pitch-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pitch-duree{color:var(--txt2);font-size:.9rem;margin-right:auto}
.pitch-texte{margin:0;line-height:1.65}
.pitch-edit{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid var(--ligne);background:var(--champ);color:var(--txt);font:inherit;line-height:1.5;padding:10px 12px}
.projets-pres{display:flex;flex-direction:column;gap:12px}
.filtres-pres{gap:8px}
.grille-pres{display:grid;grid-template-columns:1fr;gap:12px}
.carte-projet{display:flex;flex-direction:column;gap:10px}
.carte-projet h3{font-size:1.1rem}
.tags-pres{gap:6px}
.tag-pres{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--fond2);border:1px solid var(--ligne)}
.tag-ia{background:rgba(20,163,139,.14);border-color:rgba(20,163,139,.5);color:#0B6E5E}
html[data-theme="nuit"] .tag-ia{color:#6FE0CB}
.statut-ia{flex:none;font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--ligne)}
.st-deploye{background:rgba(76,217,100,.18);color:var(--vert-txt);border-color:rgba(76,217,100,.5)}
.st-prototype{background:rgba(31,111,224,.12);color:#1659B8;border-color:rgba(31,111,224,.4)}
html[data-theme="nuit"] .st-prototype{color:#9CC2FF}
.st-propose{background:rgba(242,162,92,.18);color:var(--orange-txt);border-color:rgba(242,162,92,.5)}
.dl-pres{margin:0;display:flex;flex-direction:column;gap:6px}
.dl-pres div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}
.dl-pres dt{font-weight:700;color:var(--txt2);font-size:.9rem}
.dl-pres dd{margin:0;line-height:1.5}
.a-completer{color:var(--orange-txt);font-weight:700}
@media (max-width:420px){ .dl-pres div{grid-template-columns:1fr;gap:0} }
.moi-actions{gap:8px}
.moi-bloc{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:var(--r);background:var(--carte);border:1px solid var(--ligne);box-shadow:var(--ombre)}
.moi-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.moi-tete h3{font-size:1.15rem}
.moi-duree{color:var(--txt2);font-size:.9rem;margin-right:auto}
.moi-recit{margin:0;line-height:1.7;font-size:1.04rem}
.frise-moi{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--ligne);display:flex;flex-direction:column;gap:14px}
.frise-moi li{position:relative;display:flex;flex-direction:column;gap:2px}
.frise-moi li::before{content:"";position:absolute;left:-26px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--bleu);border:3px solid var(--carte)}
.frise-per{font-size:.82rem;font-weight:800;color:var(--orange-txt);letter-spacing:.03em}
.frise-appris{color:var(--txt2);font-size:.95rem}
.chiffres-moi{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;line-height:1.5;font-weight:600}
.ia-section h3{display:flex;align-items:center;gap:8px}
.ia-ligne{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--ligne)}
.ia-ligne h4{margin:0;font-size:1.02rem}
.ia-cols{display:grid;grid-template-columns:1fr;gap:8px}
.ia-col{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;border-radius:12px;background:var(--fond2);border:1px solid var(--ligne)}
.ia-col-agent{background:rgba(20,163,139,.1);border-color:rgba(20,163,139,.4)}
.ia-col p{margin:0;line-height:1.5}
.ia-lbl{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2)}
.st-teste{background:rgba(31,111,224,.12);color:#1659B8;border-color:rgba(31,111,224,.4)}
html[data-theme="nuit"] .st-teste{color:#9CC2FF}
.st-avalider{background:transparent;color:var(--txt2);border-style:dashed}
.note-projet{margin:0;font-size:.9rem;font-weight:700;color:var(--orange-txt)}
@media (min-width:700px){ .ia-cols{grid-template-columns:1fr 1fr} }
.qc-affiche .moi-recit{font-size:clamp(1.1rem,1.6vw,1.3rem)}
.qc-affiche .chiffres-moi,.qc-affiche .frise-moi{font-size:clamp(1.05rem,1.4vw,1.2rem)}
.qc-affiche .qc-panneau .moi-recit{font-size:1rem}
.qc-affiche .qc-panneau .chiffres-moi{font-size:1rem}
@media (min-width:1024px){ .grille-pres{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* ---------- Méthodes ---------- */
.nav button{width:60px}
.regles-or{display:flex;flex-direction:column;gap:10px}
.regles{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;counter-reset:r}
.regles li{counter-increment:r;display:flex;gap:8px;align-items:baseline;font-weight:700}
.regles li::before{content:counter(r);flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bleu);color:#fff;font-size:.8rem}
.famille-meth{display:flex;flex-direction:column;gap:12px}
.famille-meth h2{display:flex;align-items:center;gap:10px;font-size:1.2rem}
.famille-meth h2 .ic{color:var(--bleu)}
html[data-theme="nuit"] .famille-meth h2 .ic{color:#9CC2FF}
.grille-meth{display:grid;grid-template-columns:1fr;gap:10px}
.carte-meth{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:16px;background:var(--carte);border:1px solid var(--ligne);color:var(--txt);cursor:pointer;box-shadow:var(--ombre);min-height:88px;font:inherit}
.carte-meth.revisee{border-color:rgba(76,217,100,.6)}
.meth-haut{display:flex;width:100%;justify-content:space-between;align-items:center}
.meth-id{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--orange-txt)}
.meth-ok{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(76,217,100,.18);color:var(--vert-txt)}
.meth-ok .ic{width:18px;height:18px}
.meth-titre{font-weight:700;font-size:1.05rem;line-height:1.35}
.meth-info{color:var(--txt2);font-size:.9rem}
.feuille-meth{display:flex;flex-direction:column;gap:14px}
.feuille-meth h2{font-size:1.35rem;outline:none}
.annonce-meth{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:14px;background:rgba(31,111,224,.09);border:1px solid rgba(31,111,224,.35)}
.annonce-meth p{margin:0;font-weight:600;line-height:1.55}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.etape{position:relative}
.etape:not(:last-child)::after{content:"";position:absolute;left:21px;top:48px;bottom:-4px;width:2px;background:var(--ligne)}
.etape-btn{all:unset;box-sizing:border-box;display:flex;gap:14px;width:100%;padding:8px 4px 14px;cursor:pointer;border-radius:12px}
.etape-btn:focus-visible{outline:3px solid #FFB547}
.etape-num{flex:none;display:grid;place-items:center;width:36px;height:36px;margin-left:3px;border-radius:50%;background:var(--bleu);color:#fff;font-weight:800;position:relative;z-index:1}
.etape-corps{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:6px}
.etape-titre{font-weight:700;font-size:1.05rem}
.etape-dev{display:none;line-height:1.6;color:var(--txt2)}
.etape.ouvert .etape-dev{display:block}
.etape-cache{display:none;font-size:.9rem;color:var(--txt2);font-style:italic}
.revision .etape-mc,.revision .etape-dev{display:none}
.revision .etape:not(.revele) .etape-cache{display:block}
.revision .etape.revele .etape-mc{display:flex}
.revision .etape.revele .etape-dev{display:block}
.revision .etape.revele .etape-num{background:var(--vert);color:#0E1A3D}
.actions-meth .btn{flex:1 1 200px}
@media (min-width:1024px){
  .grille-meth{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .regles{grid-template-columns:repeat(4,auto);justify-content:start;gap:8px 28px}
  .nav button{width:100%}
}
/* ---------- Anglais : bascule FR | EN et lexique ---------- */
.bascule-langue button{min-width:48px}
.entete-droite{margin-left:auto}
.entete-meth{flex-wrap:wrap;row-gap:10px}
.entete-meth .flex{flex-wrap:nowrap}
.entete-meth .btn{white-space:nowrap}
.lexique .lex-champ{min-height:52px;font-size:1.05rem}
.lex-liste{display:flex;flex-direction:column;gap:10px}
.lex-item{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--carte);border:1px solid var(--ligne)}
.lex-haut{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lex-en{font-size:1.15rem;font-weight:800;line-height:1.3}
.lex-fr{color:var(--txt2);font-weight:600}
.lex-ex{font-style:italic;line-height:1.5}
.lex-ecoute{flex:none;color:var(--bleu)}
html[data-theme="nuit"] .lex-ecoute{color:#9CC2FF}
@media (min-width:1024px){ .lex-liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))} }
/* Fiches : question, plan en mots-clés, mots utiles */
.fiche-lbl{display:block;font-size:.75rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--txt2);margin-bottom:6px}
.fiche-q{padding:12px 16px;border-radius:14px;background:var(--carte);border:1px solid var(--ligne)}
.fiche-q p{margin:0;font-weight:700;line-height:1.45}
.fiche-q-en{margin-top:4px!important;font-weight:600!important;color:var(--txt2);font-style:italic}
.fiche-plan{padding:14px 16px;border-radius:16px;background:var(--marine);color:#fff}
.fiche-plan .fiche-lbl{color:#F6D5B5}
.fiche-plan ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.fiche-plan li{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:800;font-size:1.02rem}
.fiche-plan li b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#0E1A3D;font-size:.85rem}
.qc-affiche .fiche-plan li{font-size:clamp(1.05rem,1.5vw,1.25rem)}
.fiche-mots{padding:12px 16px;border-radius:14px;background:var(--carte);border:1px solid var(--ligne)}
.fiche-mots ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px}
.fiche-mots li{display:flex;flex-direction:column;padding:4px 0;border-bottom:1px dashed var(--ligne)}
.fiche-mots li span{color:var(--txt2);font-size:.92rem}
.fiche-vig{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;line-height:1.5}
.entraine{padding:14px 16px;border-radius:14px;background:var(--carte);border:2px solid var(--bleu)}
.entraine textarea{width:100%;box-sizing:border-box;min-height:110px;border-radius:12px;border:1px solid var(--ligne);background:var(--champ);color:var(--txt);font:inherit;font-size:1.02rem;line-height:1.5;padding:10px 12px;resize:vertical}
.rep-type-fr{margin-top:6px}
.qc-panneau .rep-type{border-radius:var(--r);box-shadow:var(--ombre)}
.qc-affiche .qc-panneau .rep-type p{font-size:.92rem;line-height:1.5}
.qc-affiche .qc-panneau .rep-type .rep-type-txt{font-size:1.08rem;line-height:1.6}
.qc-questions .qc-pan-bloc{box-shadow:none}
.qc-affiche .entraine p,.qc-affiche .coach p{font-size:1rem}
.qc-affiche .coach .rm-texte{font-size:1.08rem}
.rep-type-fr>summary{cursor:pointer;font-weight:700;color:var(--txt2)}
/* Correction du coach */
.coach{gap:10px}
.coach h4 .source{white-space:nowrap}
.coach p{margin:0;line-height:1.55}
.coach-verdict{display:flex;align-items:flex-start;gap:10px;font-weight:700}
.coach-dec{flex:none;font-size:.8rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.dec-repete{background:rgba(242,162,92,.22);color:var(--orange-txt);border:1px solid rgba(242,162,92,.6)}

/* Carnet de préparation : surfaces papier, encre et repères de parcours. */
:root{--r:16px;--bleu:#2858a8;--bleu-fonce:#193f82}
html[data-theme="jour"]{--fond:#f7f6f1;--fond2:#ebece5;--page1:#ebeae2;--page2:#e1e4db;--txt:#192a31;--txt2:#42555c;--txt3:#53676e;--verre:#fffefa;--verre-bord:#d7dcd5;--ligne:#d5dbd6;--carte:#fffefa;--nav:#152a32;--ombre:0 2px 5px #20332c09}
html[data-theme="nuit"],.force-nuit{--fond:#121c21;--fond2:#223037;--page1:#142126;--page2:#0b1216;--txt:#f0f4f1;--txt2:#c2cfcf;--txt3:#a5b8ba;--carte:#1c292f;--verre:#213037;--verre-bord:#38494c;--ligne:#37484c;--champ:#1b292f;--nav:#101c21;--ombre:0 2px 8px #0002}
.decor{display:none}.carte{box-shadow:var(--ombre)}
h1,h2{letter-spacing:-.035em;text-wrap:balance}.entete h1,.hero h1{font-family:Georgia,'Times New Roman',serif;font-weight:500}
.nav button[aria-current="page"]{background:#ffffff18;color:#fff}.nav button[aria-current="page"] .point{background:#ffd59d}
.hero{background:var(--fond);color:var(--txt);isolation:isolate;min-height:0;border-bottom:1px solid var(--ligne)}
.hero>svg.paysage{left:auto;right:0;width:46%;mask-image:linear-gradient(to right,transparent,#000 70%);opacity:.7;z-index:-1}
.hero-haut{padding:26px 18px 0}.hero-haut .btn-icone{background:var(--carte);border:1px solid var(--ligne)}
.carnet-label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt2);margin-bottom:8px}
.hero h1{font-size:clamp(2.1rem,5vw,4.2rem);line-height:1.05;overflow-wrap:anywhere}.hero .date{color:var(--txt2)}
.hero-corps{padding:14px 18px 22px}.hero .chip{background:var(--carte)!important}.carte.aujourdhui{background:#19353f;color:#fff;border:0;box-shadow:none}
.aujourdhui .etiquette{color:#ffdaaa}.aujourdhui .muet{color:#d1dfdf}.aujourdhui .titre{font-size:clamp(1.25rem,2vw,1.7rem);letter-spacing:-.025em}.aujourdhui .btn{background:#ffdaaa;border-color:#ffdaaa;color:#233239;margin-top:8px}
.badge-serie .chip{font-variant-numeric:tabular-nums;font-size:.88rem;background:transparent;border:1px solid var(--ligne)}
.rangee{display:grid;grid-template-columns:1fr;margin:0;padding:0;overflow:visible;gap:0;border-top:1px solid var(--ligne)}
.rangee .tuile-act{min-width:0;min-height:74px;background:transparent;border:0;border-bottom:1px solid var(--ligne);border-radius:0;box-shadow:none;padding:14px 8px}.tuile-act strong{color:var(--txt)}.tuile-act::after{content:'›';margin-left:auto;color:var(--txt3);font-size:1.35rem}.tuile-act .ic{width:25px;height:25px}
.qc-pan-piste,.qc-affiche .fb-bloc p,.qc-et-corps{max-width:65ch}.qc-pan-piste{line-height:1.6}.qc-fam-onglets button[aria-pressed="true"],.qc-onglet[aria-pressed="true"]{font-weight:800;box-shadow:inset 0 -3px #ffffff65}
@media(min-width:1024px){.hero-haut{padding:38px 48px 0}.hero-corps{padding:16px 48px 32px;max-width:730px}.aujourdhui .btn{width:auto;min-width:10rem}.rangee{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px}.nav-marque{border-bottom:1px solid #ffffff29;margin-bottom:12px}.hero>svg.paysage{width:50%}}
@media(hover:hover){.tuile-act:hover{background:var(--fond2)}}
@media(prefers-reduced-motion:no-preference){html:not(.taille-bus) .btn{transition:transform 120ms ease-out,background-color 120ms ease-out}html:not(.taille-bus) .btn:active:not(:disabled){transform:scale(.98)}}
@media print{.nav,.decor{display:none}#app{box-shadow:none;margin:0}}
</style>
</head>

/* ---------- Évaluation locale (règles) ---------- */
const BUSINESS_FR = ["conversion","chiffre d'affaires","marge","panier moyen","cout","acquisition","retention","decision","client","revenu","vente","lead","prospect","roi","budget","rentab"];
const BUSINESS_EN = ["conversion","revenue","margin","basket","cost","acquisition","retention","decision","client","customer","roi","sales","lead","budget","profit"];
const STAR_RE_FR = { S:/\b(contexte|situation|chez (cultura|la poste)|lorsque|quand j|a l'epoque|en 20\d\d|pendant mon alternance|sur un projet|il y a)\b/, T:/\b(objectif|but|tache|mission|je devais|il fallait|enjeu|on m'a demande|besoin)\b/, A:/\b(j'ai|j ai|nous avons|on a|je me suis|j'ai mis)\b/, R:/(\bresultat|\bimpact|\bau final|\bfinalement|cela a permis|ce qui a permis|\bgain|\breduit|\baugmente|\d+\s?%)/ };
const STAR_RE_EN = { S:/\b(context|situation|when i|at cultura|at la poste|in 20\d\d|during my|on a project)\b/, T:/\b(goal|task|objective|i had to|i needed to|we needed|mission)\b/, A:/\b(i did|i built|i set|i checked|i fixed|i decided|i explained|i created|i implemented|we did|i)\b/, R:/(\bresult|\boutcome|which led|\bsaved|\breduced|\bincreased|\d+\s?%)/ };
const CONCL_RE = /\b(donc|en resume|au final|pour conclure|ainsi|c'est pourquoi|bref|en conclusion|ce que je retiens|lecon|so overall|in short|to sum up|that's why|as a result|therefore)\b/;
const STOP = new Set("avec dans pour cette comment quelle quelles quels sont votre notre leurs entre apres avant depuis faire fais-tu peux-tu explique about what would your there their which from that this have".split(" "));

function detecter(texte, lang){
  const n = norm(texte);
  const remp = []; let nbRemp = 0;
  (lang==="en" ? REMPLISSAGE_EN : REMPLISSAGE_FR).forEach(([lib,re]) => { const m = n.match(re); if(m){ nbRemp += m.length; remp.push({ dit:lib, n:m.length }); } });
  if(lang==="en"){ const like=(n.match(/\blike\b/g)||[]).length; if(like>2){ nbRemp+=like-2; remp.push({dit:"like",n:like-2}); } }
  else {
    const unpeu=(n.match(/\bun peu\b/g)||[]).length; if(unpeu>2){ nbRemp+=unpeu-2; remp.push({dit:"un peu",n:unpeu-2}); }
    const jp=(n.match(/\bje pense que\b/g)||[]).length; if(jp>2){ nbRemp+=jp-2; remp.push({dit:"je pense que",n:jp-2}); }
  }
  const tics = [];
  if(lang!=="en"){ TICS_FR.forEach(t => { const m=n.match(t.re); if(m) tics.push({ dit:t.dit, propose:t.propose, n:m.length }); }); }
  const sugg = [];
  if(lang!=="en"){ SUGGESTIONS_FR.forEach(t => { if(n.match(t.re)) sugg.push({ dit:t.dit, propose:t.propose }); }); }
  return { remp, nbRemp, tics, sugg };
}

function affirmationsSansPreuve(texte, lang){
  const re = lang==="en" ? /\b(i am (very |really )?(rigorous|autonomous|passionate|curious|an expert|good|strong|organi[sz]ed)|i master|expert|always|perfectly|excellent|a lot of experience)\b/ : /\b(je suis (tres |vraiment )?(rigoureu|autonome|passionne|curieu|expert|bon|forte?|organise|a l'aise)|je maitrise|expert|toujours|parfaitement|excellent|tres bon|beaucoup d'experience)/;
  const preuve = lang==="en" ? /(\d|for example|for instance|at cultura|at la poste|when i)/ : /(\d|par exemple|chez |quand j|lorsque|notamment)/;
  return phrases(texte).filter(p => re.test(norm(p)) && !preuve.test(norm(p))).slice(0,3);
}

function evaluerLocal(texte, q, opts={}){
  const lang = opts.lang || "fr";
  const n = norm(texte);
  const W = mots(texte); const nw = W.length;
  const ph = phrases(texte);
  const det = detecter(texte, lang);
  const RE = lang==="en" ? STAR_RE_EN : STAR_RE_FR;
  const star = { S:RE.S.test(n), T:RE.T.test(n), A:RE.A.test(n), R:RE.R.test(n) };
  const nbStar = Object.values(star).filter(Boolean).length;
  const attendu = (q && q.attendu) || [];
  const trouves = attendu.map(a => ({ point:a.point, ok:a.mots_cles.some(k => n.includes(norm(k))) }));
  const qTexte = norm((opts.questionTexte || (q && q.enonce) || ""));
  const motsQ = qTexte.split(/[^a-z0-9']+/).filter(w => w.length>4 && !STOP.has(w));
  const suitQuestion = motsQ.some(w => n.includes(w.slice(0, Math.max(5, w.length-2)))) || trouves.some(t=>t.ok);
  /* Structure */
  let structure = 0;
  if(nbStar >= 3) structure += 2;
  const ouverture = ph.length && mots(ph[0]).length >= 4 && mots(ph[0]).length <= 30;
  const conclusion = ph.length >= 2 && CONCL_RE.test(norm(ph[ph.length-1]));
  if(ouverture && conclusion) structure += 1;
  if(nw >= 60 && nw <= 200) structure += 1;
  if(suitQuestion) structure += 1;
  /* Précision */
  let precision = attendu.length ? Math.round(trouves.filter(t=>t.ok).length / attendu.length * 5) : 3;
  /* Impact */
  const nbChiffres = (texte.match(/\d+(?:[.,]\d+)?\s?(?:%|€|k€|euros?|points?)?/g) || []).length;
  const termes = (lang==="en" ? BUSINESS_EN : BUSINESS_FR).filter(t => n.includes(t)).length;
  let impact = Math.min(5, termes + Math.min(nbChiffres, 3));
  const type = q ? q.type : "question";
  if(type === "recruteur") impact = Math.min(5, impact + 2);
  if((type === "piege" || type === "pitch") && impact > 0) impact = Math.min(5, impact + 1);
  /* Clarté */
  let clarte = 5;
  if(det.nbRemp > 3) clarte -= 2;
  const longMoy = ph.length ? nw / ph.length : nw;
  if(longMoy > 30) clarte -= 1;
  clarte -= Math.min(2, det.tics.reduce((a,t)=>a+t.n,0));
  const posture = (type === "star") && /^\s*(je suis|i am)\b/.test(n) && !star.S;
  if(posture) clarte -= 1;
  clarte = clamp(clarte, 0, 5);
  /* Concision */
  let concision = nw < 40 ? 2 : nw <= 180 ? 5 : nw <= 260 ? 3 : 1;
  if(nw < 3) { structure = 0; precision = 0; impact = 0; clarte = Math.min(clarte, 1); concision = 0; }
  const scores = { structure:clamp(structure,0,5), precision:clamp(precision,0,5), impact:clamp(impact,0,5), clarte, concision };
  const note = r1(moy(Object.values(scores)));
  /* Débit */
  const dureeMin = (opts.duree || 0) / 60000;
  const wpm = dureeMin > 0.08 ? Math.round(nw / dureeMin) : null;
  const rempMin = dureeMin > 0.08 ? r1(det.nbRemp / dureeMin) : null;
  /* Textes */
  const LIB = { structure:"structure", precision:"précision technique", impact:"impact business", clarte:"clarté", concision:"concision" };
  const tri = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const meilleur = tri[0][0], pire = tri[tri.length-1][0];
  const manquants = trouves.filter(t=>!t.ok).map(t=>t.point);
  const presents = trouves.filter(t=>t.ok).map(t=>t.point);
  const PF = {
    structure: nbStar>=3 ? "La réponse suit une logique STAR lisible (situation, action, résultat)." : "La réponse a une ouverture et une conclusion nettes.",
    precision: presents.length ? "Tu couvres les points attendus : "+presents.slice(0,3).join(", ")+"." : "Tu restes sur le sujet de la question.",
    impact: nbChiffres ? "Tu appuies ta réponse sur des chiffres, c'est ce qu'attend un manager." : "Tu relies la réponse à des enjeux business.",
    clarte: "Le discours est clair, sans tic de langage gênant.",
    concision: "La longueur est maîtrisée ("+nw+" mots)."
  };
  const PA = {
    structure: posture ? "Tu affirmes une posture (« je suis... ») sans situation précise : raconte un exemple daté, ton action et le résultat." : nbStar<3 ? "Structure en STAR : situation précise, objectif, ce que TU as fait, résultat chiffré." : "Termine par une conclusion explicite qui répond à la question.",
    precision: manquants.length ? "Il manque : "+manquants.slice(0,4).join(", ")+"." : "Ajoute un détail technique vérifiable (outil, paramètre, méthode).",
    impact: "Relie la réponse à un enjeu business (conversion, chiffre d'affaires, coût, décision) avec un chiffre réel, ou dis que tu ne l'as pas.",
    clarte: det.tics.length ? "Remplace les tics : "+det.tics.map(t=>"« "+t.dit+" » par "+t.propose).join(" ; ")+"." : det.nbRemp>3 ? "Trop de mots de remplissage ("+det.nbRemp+") : marque une pause silencieuse à la place." : "Phrases trop longues : vise moins de 25 mots par phrase.",
    concision: nw < 40 ? "Réponse trop courte ("+nw+" mots) : développe avec un exemple." : "Réponse trop longue ("+nw+" mots) : vise 60 à 180 mots."
  };
  const version = versionAmelioree(texte, q, { star, trouves, lang });
  const vocab = det.tics.map(t=>({ dit:t.dit, propose:t.propose })).concat(det.sugg).concat(det.remp.map(r=>({ dit:r.dit, propose:lang==="en"?"pause":"une pause silencieuse", remplissage:true, n:r.n })));
  return {
    source:"local", scores, note, nw, wpm, rempMin, nbRemp:det.nbRemp, tics:det.tics, remp:det.remp, nbChiffres, starComplet: nbStar===4, nbStar,
    point_fort: PF[meilleur], point_a_ameliorer: PA[pire], version_amelioree: version,
    vocabulaire: vocab, affirmations_a_verifier: affirmationsSansPreuve(texte, lang), manquants, posture, lang
  };
}

function versionAmelioree(texte, q, { star, trouves, lang }){
  const ph = phrases(texte);
  const RE = lang==="en" ? STAR_RE_EN : STAR_RE_FR;
  const trouve = k => { const p = ph.find(x => RE[k].test(norm(x))); return p ? "« "+p.replace(/[.!?]+$/,"")+" »" : null; };
  const type = q ? q.type : "question";
  if(lang === "en"){
    if(["star"].includes(type) || (q && q.attendu && q.attendu[0] && q.attendu[0].point==="Situation"))
      return "Situation: "+(trouve("S")||"[where and when, precisely]")+". Task: "+(trouve("T")||"[your goal]")+". Action: "+(trouve("A")||"[what YOU did, step by step]")+". Result: "+(trouve("R")||"[real figure, or say you don't have it]")+". Learning: [what you changed since].";
    return "Opening: answer in one sentence. Then cover: "+trouves.map(t=>t.point+(t.ok?" (covered)":" (to add)")).join(", ")+". Close with a recommendation or next step.";
  }
  if(type === "star" || type === "pitch"){
    return "Situation : "+(trouve("S")||"[contexte précis : où, quand, quel enjeu]")+". Tâche : "+(trouve("T")||"[ton objectif]")+". Action : "+(trouve("A")||"[ce que TU as fait, à la première personne]")+". Résultat : "+(trouve("R")||"[chiffre réel à compléter, ou dis que tu ne l'as pas]")+". Leçon : [ce que tu fais différemment depuis].";
  }
  if(type === "cas"){
    return "Trame : "+trouves.map(t=>t.point+(t.ok?" (couvert)":" (à ajouter)")).join(" ; ")+". Ouvre par le cadrage en une phrase, termine par la recommandation priorisée et la façon de la mesurer.";
  }
  const ouverture = ph[0] ? "« "+ph[0].replace(/[.!?]+$/,"")+" »" : "[ta réponse en une phrase]";
  return "Ouverture : "+ouverture+". Points à couvrir : "+(trouves.length ? trouves.map(t=>t.point+(t.ok?" (couvert)":" (à ajouter)")).join(", ") : "[un exemple concret]")+". Conclusion : ce que tu recommandes ou ce que tu vérifierais en premier.";
}

/* fusion avec un feedback Gemini (jamais inventé : seulement si Gemini l'a renvoyé) */
function fusionFeedback(local, g){
  if(!g || !g.scores) return local;
  const s = {}; let ok = true;
  ["structure","precision","impact","clarte","concision"].forEach(k => { const v = Number(g.scores[k]); if(!isFinite(v)) ok=false; s[k] = clamp(Math.round(v),0,5); });
  if(!ok) return local;
  const vocab = local.vocabulaire.slice();
  (Array.isArray(g.vocabulaire)?g.vocabulaire:[]).forEach(v => { if(v && v.dit && !vocab.some(x=>norm(x.dit)===norm(v.dit))) vocab.push({ dit:sansTiret(v.dit), propose:sansTiret(v.propose||"") }); });
  const aff = local.affirmations_a_verifier.slice();
  (Array.isArray(g.affirmations_a_verifier)?g.affirmations_a_verifier:[]).forEach(a => { if(a && !aff.includes(a)) aff.push(sansTiret(a)); });
  return Object.assign({}, local, { source:"gemini", noteLocale: local.note, scores:s, note:r1(moy(Object.values(s))),
    point_fort: sansTiret(g.point_fort || local.point_fort), point_a_ameliorer: sansTiret(g.point_a_ameliorer || local.point_a_ameliorer),
    version_amelioree: sansTiret(g.version_amelioree || local.version_amelioree), vocabulaire:vocab, affirmations_a_verifier:aff.slice(0,4) });
}

class ErrGem extends Error{ constructor(type, msg, extra){ super(msg); this.type=type; Object.assign(this, extra||{}); } }
/* File d'attente à deux priorités : le manager (haute) passe avant les réponses modèles (basse).
   Une tâche basse en cours est interrompue si une tâche haute arrive, puis relancée ensuite. */
const FILE = { haute:[], basse:[], actif:null };
function enFile(fn, prio){
  return new Promise((res, rej) => {
    const t = { fn, res, rej, prio: prio === "basse" ? "basse" : "haute" };
    FILE[t.prio].push(t);
    if(t.prio === "haute" && FILE.actif && FILE.actif.prio === "basse" && FILE.actif.ctrl) FILE.actif.ctrl.abort("preempt");
    pomperFile();
  });
}
async function pomperFile(){
  if(FILE.actif) return;
  const t = FILE.haute.shift() || FILE.basse.shift(); if(!t) return;
  FILE.actif = t; t.ctrl = new AbortController(); t.debut = Date.now();
  try{ t.res(await t.fn(t)); }
  catch(e){ if(e && e.type === "preempt") FILE.basse.unshift(t); else t.rej(e); }
  finally{ FILE.actif = null; setTimeout(pomperFile, 0); }
}
/* Abandon par l'utilisateur de l'appel haute priorité en cours (bouton « Continuer sans attendre ») */
function annulerAppelManager(){ if(FILE.actif && FILE.actif.prio === "haute" && FILE.actif.ctrl){ FILE.actif.ctrl.abort("user"); return true; } return false; }
function appelEnCours(){ return FILE.actif ? { prio:FILE.actif.prio, depuis:FILE.actif.debut } : null; }
async function attendreCreneau(signal){
  const att = GEM.dernier + 6000 - Date.now();
  if(att > 0) await new Promise((r, j) => { const to = setTimeout(r, att); if(signal) signal.addEventListener("abort", () => { clearTimeout(to); r(); }, { once:true }); });
  GEM.dernier = Date.now();
}
function errAbort(signal){
  const r = signal && signal.reason;
  if(r === "preempt") return new ErrGem("preempt", "Interrompu par un appel prioritaire.");
  if(r === "user") return new ErrGem("annule", "Gemini ignoré pour cette réponse : question suivante en mode local.");
  return new ErrGem("lent", "Gemini a mis trop de temps à répondre, mode local pour cette réponse.");
}
function lireTexte(data){
  const parts = (((data||{}).candidates||[])[0]||{}).content ? data.candidates[0].content.parts || [] : [];
  return parts.filter(p => !p.thought).map(p => p.text || "").join("").replace(/^\s*```(?:json)?\s*/i,"").replace(/\s*```\s*$/,"").trim();
}

async function geminiJSON(systeme, contents, opts={}){
  if(!(await avisConfidentialite())) throw new ErrGem("refus", "Appel annulé, mode local.");
  const delaiMax = opts.delai || (opts.priorite === "basse" ? 45000 : 25000);
  return enFile(async (tache) => {
    const R = reglages(); const cle = cleApi();
    const signal = tache.ctrl.signal;
    const minuteur = setTimeout(() => tache.ctrl.abort("timeout"), delaiMax);
    try{
    /* Mode rapide (option, ou tâches secondaires) : Flash-Lite en premier, le modèle habituel en secours */
    const rapide = !!(opts.rapide || R.modeRapide);
    const lite = rapide ? (classerModeles(GEM.dispo || R.modeles || []).find(n => /flash-lite/.test(n)) || "gemini-flash-lite-latest") : null;
    let modeles = chaineModeles(lite || R.modele, GEM.dispo || R.modeles);
    if(lite && R.modele && !modeles.includes(R.modele)) modeles.push(R.modele);
    const debutTache = Date.now();
    let derniereErr = null, listeChargee = !!GEM.dispo;
    for(let idx = 0; idx < modeles.length && idx < 6; idx++){
      const m = modeles[idx];
      const options = optionsReflexion(m);
      let iRef = GEM.reflexionOK && GEM.reflexionOK[m] != null ? GEM.reflexionOK[m] : 0;
      for(let essai = 0; essai < 4; essai++){
        const gen = { temperature: opts.temperature ?? 0.7, responseMimeType:"application/json" };
        const tc = options[Math.min(iRef, options.length-1)]; if(tc) gen.thinkingConfig = tc;
        const corps = { systemInstruction:{ parts:[{ text:systeme }] }, contents, generationConfig:gen };
        await attendreCreneau(signal);
        if(signal.aborted) throw errAbort(signal);
        const debutReq = Date.now();
        let res;
        try{
          res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(m)+":generateContent", { method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key":cle }, body:JSON.stringify(corps), signal });
        }catch(e){ if(signal.aborted) throw errAbort(signal); throw new ErrGem("reseau", "Réseau indisponible, mode local pour cette réponse."); }
        if(res.status === 404){
          GEM.dernier = 0; /* un 404 ne consomme pas de quota : on essaie le suivant tout de suite */
          derniereErr = new ErrGem("modele", "Aucun modèle Gemini accessible avec cette clé (dernier essai : "+m+"). Va dans Réglages, puis « Tester la clé ».");
          if(!listeChargee){
            listeChargee = true;
            try{ const ms = await listerModeles(cle); GEM.dispo = ms; majReglages({ modeles:ms }); modeles = modeles.slice(0, idx+1).concat(chaineModeles(null, ms).filter(x => !modeles.slice(0, idx+1).includes(x))); }catch(e){}
          }
          break;
        }
        incrCompteur();
        if(res.status === 429){
          let delai = 60; try{ const j = await res.json(); const d = ((j.error||{}).details||[]).find(x => x.retryDelay); if(d) delai = Math.ceil(parseFloat(d.retryDelay)) || 60; }catch(e){}
          GEM.localJusqua = Date.now() + delai*1000;
          throw new ErrGem("quota", "Quota gratuit atteint, mode local pendant "+Math.max(1, Math.ceil(delai/60))+" minute"+(delai>60?"s":"")+".", { delai });
        }
        if(res.status === 400 || res.status === 401 || res.status === 403){
          let msg = ""; try{ const j = await res.json(); msg = (j.error||{}).message || ""; }catch(e){}
          if(/thinking/i.test(msg) && iRef < options.length-1){ iRef++; continue; }
          if(res.status === 400 && /not found|not supported|deprecated|no longer|unknown model|invalid model/i.test(msg)){ GEM.dernier = 0; derniereErr = new ErrGem("modele", "Modèle "+m+" indisponible : "+msg.slice(0,100)); break; }
          if(res.status !== 400 || /api key|api_key|permission|unauth/i.test(msg)){ GEM.cleRefusee = true; throw new ErrGem("cle", "Clé refusée par Google AI Studio. Vérifie-la dans les réglages."); }
          throw new ErrGem("requete", "Requête refusée par Gemini ("+msg.slice(0,120)+").");
        }
        if(!res.ok){ derniereErr = new ErrGem("serveur", "Gemini indisponible (erreur "+res.status+")."); break; }
        let data; try{ data = await res.json(); }catch(e){ if(signal.aborted) throw errAbort(signal); derniereErr = new ErrGem("json","Réponse illisible."); continue; }
        if((data.promptFeedback||{}).blockReason) throw new ErrGem("bloque", "Réponse bloquée par le filtre de Gemini, évaluation locale.");
        const c0 = (data.candidates||[])[0];
        if(!c0 || c0.finishReason === "SAFETY") throw new ErrGem("bloque", "Réponse bloquée par le filtre de Gemini, évaluation locale.");
        const txt = lireTexte(data);
        try{
          const obj = JSON.parse(txt);
          if(!rapide && m !== reglages().modele){ majReglages({ modele:m }); if(typeof toast === "function") toast("Modèle Gemini choisi automatiquement : "+m); }
          GEM.durees = (GEM.durees || []).concat([{ total: Date.now() - debutTache, gemini: Date.now() - debutReq, m, prio: opts.priorite || "haute" }]).slice(-6);
          GEM.modeleOK = m; GEM.reflexionOK = GEM.reflexionOK || {}; GEM.reflexionOK[m] = iRef;
          return { obj, modele: m };
        }
        catch(e){ derniereErr = new ErrGem("json", "JSON invalide renvoyé par Gemini."); if(essai >= 1) break; }
      }
      if(derniereErr && derniereErr.type === "json") throw new ErrGem("json", "JSON invalide après une nouvelle tentative, évaluation locale.");
    }
    throw derniereErr || new ErrGem("modele", "Aucun modèle disponible.");
    } finally { clearTimeout(minuteur); }
  }, opts.priorite);
}
/* Choix du modèle : on ne suppose plus qu'un nom fixe existe, on part de la liste que la clé autorise */
const MODELES_SECOURS = ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"];
const EXCLUS_MODELE = /embedding|imagen|image|tts|audio|live|aqa|gemma|learnlm|robotics|computer|veo|banana|native|vision|exp-|thinking/i;
function rangModele(n){
  const fam = /flash-lite/.test(n) ? 2 : /flash/.test(n) ? 3 : /pro/.test(n) ? 1 : 0;
  const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || "0");
  const stable = /preview|exp/.test(n) ? 0 : 1;
  return stable * 1000 + fam * 100 + v;
}
function classerModeles(liste){
  return (liste || []).filter(n => /^gemini/.test(n) && !EXCLUS_MODELE.test(n)).sort((a,b) => rangModele(b) - rangModele(a));
}
function chaineModeles(choisi, dispo){
  const classes = classerModeles(dispo);
  const base = [choisi].concat(classes.slice(0, 4)).concat(MODELES_SECOURS).filter(Boolean);
  const uniq = Array.from(new Set(base));
  /* si la liste des modèles autorisés est connue, on écarte ceux qui n'y sont pas */
  if(!(dispo && dispo.length)) return uniq;
  const res = uniq.filter(n => dispo.includes(n)).concat(uniq.filter(n => !dispo.includes(n) && n === choisi));
  return res.length ? res : uniq;
}
function meilleurModele(dispo){ return classerModeles(dispo)[0] || null; }
/* Réflexion au minimum pour la vitesse ; on descend la liste si le modèle refuse un réglage */
function optionsReflexion(m){
  if(/gemini-2\.5-flash/.test(m)) return [{ thinkingBudget: 0 }, null];
  if(/gemini-2\.5-pro/.test(m)) return [{ thinkingBudget: 128 }, null];
  if(/flash/.test(m) && (/latest/.test(m) || Number((m.match(/gemini-(\d+)/)||[])[1]) >= 3)) return [{ thinkingLevel: "minimal" }, { thinkingLevel: "low" }, null];
  if(/latest/.test(m) || Number((m.match(/gemini-(\d+)/)||[])[1]) >= 3) return [{ thinkingLevel: "low" }, null];
  return [null];
}
function configReflexion(m){
  if(/gemini-2\.5-flash/.test(m)) return { thinkingBudget: 0 };
  if(/gemini-2\.5-pro/.test(m)) return { thinkingBudget: 128 };
  if(/gemini-(\d+)/.test(m) && Number(m.match(/gemini-(\d+)/)[1]) >= 3) return { thinkingLevel: "low" };
  if(/latest/.test(m)) return { thinkingLevel: "low" };
  return null;
}
async function listerModeles(cle){
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", { headers:{ "x-goog-api-key":cle } });
  if(!res.ok) throw new ErrGem("liste", "Liste des modèles indisponible ("+res.status+").");
  const j = await res.json();
  return (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes("generateContent")).map(m => m.name.replace(/^models\//,""));
}
/* Essai réel d'un appel generateContent (texte neutre, aucune donnée personnelle) */
async function trouverModeleFonctionnel(cle, dispo, choisi){
  for(const m of chaineModeles(choisi, dispo).slice(0, 6)){
    let res;
    try{ res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(m)+":generateContent", { method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key":cle },
      body:JSON.stringify({ contents:[{ role:"user", parts:[{ text:"Réponds seulement : OK" }] }], generationConfig:{ maxOutputTokens:64 } }) }); }
    catch(e){ throw new ErrGem("reseau", "Réseau indisponible pendant le test."); }
    if(res.status !== 404) incrCompteur();
    if(res.ok) return { modele:m };
    if(res.status === 429) return { modele:m, quota:true };
    if(res.status === 401 || res.status === 403){ let msg=""; try{ msg = ((await res.json()).error||{}).message || ""; }catch(e){} throw new ErrGem("cle", "Clé refusée ("+res.status+"). "+msg.slice(0,140)); }
  }
  return null;
}
async function testerCle(cle){
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", { headers:{ "x-goog-api-key":cle } });
  if(!res.ok){
    let msg=""; try{ msg = ((await res.json()).error||{}).message || ""; }catch(e){}
    if(res.status===400 || res.status===401 || res.status===403) throw new ErrGem("cle", "Clé refusée ("+res.status+"). "+msg.slice(0,140));
    if(res.status===429) throw new ErrGem("quota", "Quota atteint, réessaie plus tard.");
    throw new ErrGem("serveur", "Erreur "+res.status+". "+msg.slice(0,140));
  }
  const j = await res.json();
  return (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes("generateContent")).map(m => m.name.replace(/^models\//,""));

function projetPertinent(q, question){
  const ps = projets(); if(!ps.length) return null;
  const tags = (q && q.tags || []).map(norm), txt = norm(question || (q && q.enonce) || "");
  let best = null, bs = 0;
  ps.forEach(p => {
    const mc = String(p.motsCles||"").split("|").map(norm).filter(Boolean);
    let s = 0;
    mc.forEach(k => { if(txt.includes(k)) s += 3; if(tags.some(t => t && (k.includes(t) || t.includes(k)))) s += 2; });
    if(txt.includes(norm(p.nom).split(",")[0])) s += 1;
    if(s > bs){ bs = s; best = p; }
  });
  return best || ps.find(p => p.lecon && p.difficulte) || ps[0];
}

  const r = roundCourant(s);
  if(r){ const m = ecouleS(s)/60; const ph = ROUNDS[r].phases; return ph.find(p => m >= p.debut && m < p.fin) || ph[ph.length-1]; }

}
function parseAttendu(str){ return (str||"").split(";").filter(Boolean).map(p => { const i = p.indexOf(":"); return { point:p.slice(0,i).trim(), mots_cles:p.slice(i+1).split("|").map(x=>x.trim()).filter(Boolean) }; }); }
function melanger(a, seed){ const r = rand(seed || Date.now()); const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; }

  if(!roundCourant(s)){ const id = s.questions.find(id => !s.asked.includes(id)); return id ? qS(s, id) : null; }
  const phases = ROUNDS[roundCourant(s)].phases, i0 = phases.indexOf(ph);
  for(let i = i0; i < phases.length; i++){
    const p = phases[i];
    if(i > i0 && p.kind === "questions_au_recruteur") break;
    let c = (p.pool||[]).map(id => qS(s,id)).filter(q => q && !s.asked.includes(q.id));
    if(!c.length && p.modules) c = melanger(QB.filter(q => p.modules.includes(q.module) && !s.asked.includes(q.id)), hash(s.id+p.id));
    if(c.length){ c[0]._phase = p; return c[0]; }
  }
  return null;

/* Réactions variées, selon la qualité de la réponse, pour un enchaînement plus naturel en mode local */
const REACTIONS = {
  fr:{ bon:["Très clair, merci.","C'est précis, j'aime bien.","Bien, c'est exactement le niveau de détail attendu.","Parfait, c'est concret.","Ok, c'est carré."],
       moyen:["D'accord.","Je vois.","Merci, je note.","Entendu.","Ok, ça me donne une idée."],
       faible:["D'accord, on pourra y revenir.","Je note, on creusera peut-être plus tard.","Ok, passons à autre chose.","Entendu, avançons."] },
  en:{ bon:["Very clear, thanks.","That's precise, I like it.","Good, that's concrete."], moyen:["Okay.","I see.","Thanks, noted.","Got it."], faible:["Okay, we may come back to that.","Noted, let's move on."] }
};
const TRANSITIONS = {
  fr:["Changeons d'angle.","Autre sujet.","Je voudrais t'entendre sur autre chose.","Restons dans le concret.","Question suivante.","Petit changement de sujet.","Allons un peu plus loin."],
  en:["Let's change angle.","Another topic.","Next question.","Let's stay concrete."]

function reaction(s, ev){
  const L = REACTIONS[s.lang === "en" ? "en" : "fr"], k = !ev ? "moyen" : ev.note >= 3.8 ? "bon" : ev.note >= 2.5 ? "moyen" : "faible";
  const r = rand(hash(s.id + s.asked.length + "r"))();
  const T = TRANSITIONS[s.lang === "en" ? "en" : "fr"];
  const t = r < 0.45 ? " "+T[Math.floor(rand(hash(s.id + s.asked.length + "t"))() * T.length)] : "";
  return L[k][Math.floor(r * L[k].length)] + t;

function prochaineQuestion(s, avecAccuse, ev){
  const ph = phaseCourante(s), en = s.lang === "en";

  const nq = choisirQuestion(s, ph);
  if(!nq){
    if(!roundCourant(s)) return { kind:"fin", texte: en ? "That's all for this series. Have a look at your debrief." : "C'est tout pour cette série. Regarde ton débrief." };
    return { kind:"relance", texte: acc+"Peux-tu illustrer ta dernière réponse avec un exemple tiré de tes projets ?" };
  }

  const libre = ["questions","rh"].includes(php.kind) && nq.type !== "recruteur" && rand(hash(s.id + s.asked.length + "l"))() < 0.5;
  return { kind:"question", texte: acc+pre+nq.enonce, qId:nq.id, phaseId:php.id, libre, enonceBanque:nq.enonce };
}
function appliquerPlan(s, plan){ if(plan.qId){ s.qId = plan.qId; if(!s.asked.includes(plan.qId)) s.asked.push(plan.qId); s.relance = false; s.phaseId = plan.phaseId; } }
const CONTROLES_FR = ["D'où vient ce chiffre, précisément ?","Quelles sont les limites de cette donnée ?","Et si le résultat avait été inverse, qu'aurais-tu fait ?","Comment as-tu vérifié que la mesure était juste ?"];
const CONTROLES_EN = ["Where does that number come from, exactly?","What are the limits of that data?","What would you have done if the result had been the opposite?"];
function relanceTexte(ev, en, type){
  const k = Object.entries(ev.scores).filter(([c]) => c !== "structure" || ["star","pitch"].includes(type)).sort((a,b)=>a[1]-b[1])[0][0];
  const FR = { structure:"Peux-tu reprendre avec une situation précise : le contexte, ce que tu as fait, et le résultat ?", precision:"Va plus loin : concrètement, comment t'y prends-tu, étape par étape ?", impact:"Et côté business, quel impact concret, avec un ordre de grandeur réel ?", clarte:"Peux-tu le redire en deux phrases simples ?", concision:"En une phrase, quelle est ta conclusion ?" };
  const EN = { structure:"Could you take a specific situation: the context, what you did, and the result?", precision:"Can you go deeper: concretely, how would you do it, step by step?", impact:"And business-wise, what was the concrete impact?", clarte:"Could you say that again in two simple sentences?", concision:"In one sentence, what is your conclusion?" };
  return (en ? EN : FR)[k];
}
function projetMentionne(texte){
  const n = norm(texte);

  }

function recouvre(msg, cible){

function motsClesPoint(p){ return Array.from(new Set(norm(p).split(/[^a-z0-9_]+/).filter(w => w.length > 3 && !STOP.has(w)).map(w => w.length > 6 ? w.slice(0, w.length-2) : w))).slice(0, 6); }
function suivreQuestionGemini(s, plan, obj, texteM){
  const qp = typeof obj.question_posee === "string" ? sansTiret(obj.question_posee.trim()) : "";
  const banque = qS(s, plan.qId);
  if(!qp){ if(recouvre(texteM, plan.enonceBanque || plan.texte)) appliquerPlan(s, plan); else s.relance = true; return; }
  if(!plan.libre && recouvre(qp, plan.enonceBanque || plan.texte)){ appliquerPlan(s, plan); return; }
  const pts = (Array.isArray(obj.points_attendus) ? obj.points_attendus : []).filter(x => typeof x === "string" && x.trim()).slice(0, 5).map(x => sansTiret(x.trim()));
  const id = "gen-"+uid();
  s.custom = s.custom || {};
  s.custom[id] = { id, module: banque ? banque.module : (s.module || "technique"), round:0, niveau:"junior", type: banque ? banque.type : "question", genere:true,
    enonce: qp, tags: banque ? banque.tags : [], pieges:[],
    attendu: pts.length ? pts.map(p => ({ point:p, mots_cles:motsClesPoint(p) })) : (banque ? banque.attendu : []) };
  if(plan.qId && !s.asked.includes(plan.qId)) s.asked.push(plan.qId); /* le thème de la banque est consommé */
  s.qId = id; s.asked.push(id); s.relance = false; s.phaseId = plan.phaseId;
}
function dernierMessageManager(s){ for(let i=s.msgs.length-1;i>=0;i--) if(s.msgs[i].qui === "m") return s.msgs[i].texte; return ""; }
function derniersEchanges(h){ let c = h.slice(-20); while(c.length && c[0].role !== "user") c = c.slice(1); return c; }
async function appelEntretien(s, plan){
  const ph = phaseCourante(s), M = MANAGERS[s.manager], q = questionCourante(s);
  const SUGG = {
    question:"Si la réponse est suffisante, enchaîne naturellement, comme dans une vraie conversation : une courte réaction à ce qu'il vient de dire (variée, sans compliment systématique, sans donner de note), puis cette question de la banque, reformulée avec tes propres mots : « "+(plan.enonceBanque || plan.texte)+" ». Si tu poses cette nouvelle question, ajoute au JSON un champ \"question_posee\" (la question seule, en une phrase). Si la réponse est insuffisante, relance plutôt sur la même question, sans ajouter ce champ.",
    question_libre:"Si la réponse est suffisante, enchaîne naturellement, comme dans une vraie conversation : une courte réaction à ce qu'il vient de dire (variée, sans compliment systématique, sans donner de note), puis une NOUVELLE question de ton choix, sur le thème de la phase, absente des sujets déjà couverts. Ancre-la dans le parcours du candidat, dans un de ses projets, ou dans un détail précis de sa dernière réponse. Varie le format : mise en situation, question technique précise, demande d'exemple vécu, arbitrage entre deux options, question sur une limite. Thème possible pour t'inspirer : « "+(plan.enonceBanque || plan.texte)+" ». Ajoute alors au JSON deux champs : \"question_posee\" (la question seule, en une phrase) et \"points_attendus\" (3 à 5 points courts qu'une bonne réponse doit couvrir). Si la réponse est insuffisante, relance plutôt sur la même question, sans ajouter ces champs.",
    fin:"Le temps est écoulé ou les questions sont terminées : remercie le candidat et clôture en une ou deux phrases.",
    interruption:"Le candidat vient d'être coupé après 60 secondes : demande-lui sa conclusion en une phrase.",
    controle:"Mode sceptique : pose une question de contrôle sur sa dernière réponse (source du chiffre, limites, résultat inverse).",
    chiffre:"Le candidat parle d'un projet dont le résultat chiffré est « [à compléter] » : demande-lui le chiffre réel, sans en proposer aucun.",
    reponse_recruteur:"Le candidat te pose une question : réponds brièvement en restant dans ton rôle, sans inventer de chiffre sur fifty-five, puis demande s'il a une autre question.",
    relance:"Relance de façon précise sur la même question."
  };
  const attendu = q && q.attendu.length ? " Points attendus pour la question en cours (pour le feedback seulement, ne les révèle pas) : "+q.attendu.map(a=>a.point).join(", ")+"." : "";
  const vars = {
    ROLE_MANAGER:M.role, STYLE_MANAGER:M.style, PHASE: ph.label + (s.lang === "en" ? " (phase Anglais : tout se passe en anglais)" : ""),
    CONSIGNES_PHASE: ph.consignes+" "+((plan.kind === "question" && plan.libre ? SUGG.question_libre : SUGG[plan.kind]) || SUGG.relance)+attendu+" Score moyen actuel du candidat : "+(s.notes.length ? r1(moy(s.notes)) : "aucun")+" sur 5.",
    MINUTES_RESTANTES: Math.max(0, Math.ceil(tempsRestant(s)/60)), PROFIL_CANDIDAT: profilCandidat(), PROJETS_JSON: projetsJSON(),
    SUJETS_COUVERTS: s.asked.map(id => { const x = qS(s,id); return x ? x.enonce.slice(0,80) : id; }).join(" | ") || "aucun",
    MODE: s.modes.sceptique ? "sceptique" : s.modes.interruption ? "interruption" : "normal"
  };
  const { obj } = await geminiJSON(remplir(PROMPT_SYSTEME, vars), derniersEchanges(s.hist));
  if(!obj || typeof obj.manager_message !== "string" || !obj.manager_message.trim()) throw new ErrGem("json", "Réponse de Gemini sans message du manager, évaluation locale.");
  return obj;
}

function demarrerSession(cfg){

}
function initRound(s){
  const r = roundCourant(s), p = profil();
  if(r){ s.manager = ROUNDS[r].manager; s.lang = "fr"; s.duree = 1800; }
  Object.assign(s, { cle:s.id+"-"+s.ri, ecoule:0, reprise:Date.now(), pause:false, msgs:[], asked:[], qId:null, relance:false, phaseId:null, hist:[], skips:0, enControle:false,
    chiffresDemandes:[], apresInterruption:false, recruteurN:0, notes:[], averti5:false, fini:false, reps:[], xpRound:0, debutQuestion:Date.now(), debutFrappe:0, attente:false, chronoAverti:false, suite:false });
  const plan = prochaineQuestion(s, false);

  else salut = "C'est parti : "+(s.titre || "session libre")+". ";

  const texte = salut + plan.texte;
  s.msgs.push({ qui:"m", texte });
  s.hist = [{ role:"user", parts:[{ text: s.lang === "en" ? "Start of the session. The candidate is ready." : "Début du round. Le candidat est prêt." }] },
            { role:"model", parts:[{ text: JSON.stringify({ manager_message:texte, feedback:null, phase_suivante:phaseCourante(s).kind }) }] }];

function lancerLibre(module, n, ids, custom, titre){
  const mod = MODULES.find(m => m.id === module) || { nom:"Session libre", manager:"C" };
  let liste = ids;
  if(!liste){ liste = melanger(QB.filter(q => q.module === module && q.type !== "recruteur").map(q => q.id)).slice(0, n || 5); }
  if(!liste.length){ toast("Aucune question disponible pour ce module."); return; }
  const lang = module === "anglais" ? "en" : "fr";
  const premier = (custom && custom[liste[0]]) || qParId(liste[0]);
  const chronoPh = module === "vulgarisation" ? 60 : (premier && premier.type === "pitch") ? 120 : null;
  const t = titre || (mod.nom + " · " + liste.length + " question" + (liste.length>1?"s":""));
  demarrerSession({ type:"libre", module, questions:liste, custom:custom||{}, titre:t, manager:mod.manager||"C", lang, duree:Math.max(5, liste.length*4)*60,
    phaseLibre:{ id:"libre", label:t, debut:0, fin:999, kind: module === "rh" ? "rh" : module === "cas" ? "cas" : "questions", chrono:chronoPh, intro:"",
      consignes:"Entraînement libre ("+t+"). Pose les questions proposées, une à la fois, avec des relances précises." } });
}
function limiteReponse(s){
  const ph = phaseCourante(s), q = questionCourante(s);
  if(q && q.type === "pitch") return 120;
  if(q && q.type === "vulgarisation") return 60;
  if(ph && ph.chrono) return ph.chrono;
  return s.modes.chrono ? 120 : null;
}

async function envoyer(meta){
  meta = meta || {};
  if(!S || S.fini || S.attente) return;
  const ta = $("#saisie"); if(!ta) return;
  const texte = ta.value.trim();
  if(!texte){ toast("Écris ou dicte une réponse avant d'envoyer."); return; }

  const duree = VOIX.duree();
  VOIX.arreter(); VOIX.taire(); VOIX.reinit(""); ta.value = ""; majMicro();
  const q = questionCourante(S), questionTexte = dernierMessageManager(S), etaitInterrompu = S.apresInterruption;
  const msg = { qui:"c", texte, t:Date.now(), duree, interrompu:!!meta.interrompu };
  S.msgs.push(msg);
