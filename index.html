/* =====================================================================
   « Quel cas ? » : Saisie (téléphone) et Affichage (ordinateur), reliés par ntfy.sh
   Seul le code du cas (ex. « T3 ») part sur le réseau, jamais le texte saisi.
   ===================================================================== */
const TRIGGERS = [
  { code:"T1", mots:["projet","étapes","piloter","projet de tracking","mettre en place le tracking"] },
  { code:"T2", mots:["demande d'essai","devis","formulaire","essai","prise de rendez-vous"] },
  { code:"T3", mots:["écart","crm","remonte pas","ne remonte pas","différence de volume"] },
  { code:"T4", mots:["mise en production","chute","mise en prod","après la refonte","refonte"] },
  { code:"T5", mots:["doublon","deux fois","double","en double"] },
  { code:"T6", mots:["application","web","app","appli","site et application"] },
  { code:"C1", mots:["désaccord","technique","conflit","marketing et technique"] },
  { code:"C2", mots:["a/b","ab test","test ab","abandon","test a/b"] },
  { code:"C3", mots:["p-value","significatif","non concluant","0,12","0.12","pas significatif"] },
  { code:"C4", mots:["p-value","significatif","0,04","0.04","concluant"] },
  { code:"C5", mots:["tablette","mobile","segment","sous-performe","appareil"] },
  { code:"C6", mots:["hypothèse","formuler une hypothèse"] },
  { code:"C7", mots:["de 3 à 2,5","baisse de conversion","taux de conversion baisse","2,5 %","2,5%"] },
  { code:"K1", mots:["garanti","en un mois","promettre","garantie","promesse"] },
  { code:"K2", mots:["chiffre d'affaires","ventes","ca baisse","baisse du ca"] },
  { code:"K3", mots:["recommandation","recommander","que recommandes-tu"] },
  { code:"K4", mots:["dirigeant","comité","direction","codir","comex"] },
  { code:"K5", mots:["le site marche bien","marche bien","à quoi sert le tracking"] },
  { code:"K6", mots:["pourquoi le conseil","conseil","pourquoi nous","pourquoi fifty-five"] }
];
function chercherCas(texte){
  const n = norm(texte).trim(); if(!n) return [];
  const direct = METHODES.find(m => norm(m.id) === n.replace(/\s+/g,""));
  if(direct) return [direct];
  const scores = TRIGGERS.map(t => {
    let s = 0;
    t.mots.forEach(w => { const k = norm(w); if(k && n.includes(k)) s += 1 + k.length / 10; });
    return { code:t.code, s };
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s);
  return scores.slice(0, 4).map(x => METHODES.find(m => m.id === x.code)).filter(Boolean);
}

/* ---------- Topic ntfy ---------- */
function nouveauTopic(){
  const al = "abcdefghijklmnopqrstuvwxyz0123456789"; let s = "";
  const b = new Uint8Array(20);
  try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<20;i++) b[i] = Math.floor(Math.random()*256); }
  b.forEach(x => s += al[x % al.length]);
  return "harnais-" + s;
}
function topicQC(){ return store.get("topic", ""); }
function topicValide(t){ return /^[A-Za-z0-9_-]{8,64}$/.test(t || ""); }
if(!topicQC()) store.set("topic", nouveauTopic()); /* premier lancement */

const QC = { es:null, etat:"ferme", dernierId:null, relance:null, envoiEnCours:false, dernierEnvoiOk:null };
function fileQC(){ const f = store.get("fileQuelCas", []); return Array.isArray(f) ? f : []; }
async function posterCode(code){
  const t = topicQC(); if(!topicValide(t)) throw new Error("topic");
  const r = await fetch("https://ntfy.sh/" + encodeURIComponent(t), { method:"POST", body:code, headers:{ "Content-Type":"text/plain" } });
  if(!r.ok) throw new Error("HTTP " + r.status);
}
/* Envoi dans l'ordre : on ajoute à la file, puis on vide la file une entrée à la fois */
async function envoyerCode(code){
  const f = fileQC(); f.push(code); store.set("fileQuelCas", f); majEtatQC();
  await viderFileQC();
  return fileQC().length === 0;
}
async function viderFileQC(){
  if(QC.envoiEnCours) return; QC.envoiEnCours = true;
  try{
    while(fileQC().length){
      const f = fileQC();
      try{ await posterCode(f[0]); QC.dernierEnvoiOk = true; }
      catch(e){ QC.dernierEnvoiOk = false; break; }
      const g = fileQC(); g.shift(); store.set("fileQuelCas", g);
    }
  } finally { QC.envoiEnCours = false; majEtatQC(); }
}
window.addEventListener("online", () => { viderFileQC(); if(nomRoute() === "quelcas") { majEtatQC(); if(QC.vue === "affichage") ouvrirFluxQC(); } });
window.addEventListener("offline", () => majEtatQC());
setInterval(() => { if(fileQC().length && navigator.onLine !== false) viderFileQC(); }, 8000);

/* Réception : flux SSE, reconnexion automatique, reprise depuis le dernier message reçu */
function ouvrirFluxQC(){
  const t = topicQC(); if(!topicValide(t)) return;
  if(QC.es && QC.es.readyState !== 2 && QC.esTopic === t) return;
  fermerFluxQC();
  const url = "https://ntfy.sh/" + encodeURIComponent(t) + "/sse" + (QC.dernierId ? "?since=" + encodeURIComponent(QC.dernierId) : "");
  let es;
  try{ es = new EventSource(url); }catch(e){ QC.etat = "deconnecte"; majEtatQC(); return; }
  QC.es = es; QC.esTopic = t; QC.etat = "connexion"; majEtatQC();
  es.onopen = () => { QC.etat = "connecte"; majEtatQC(); };
  es.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
    if(!d || d.event !== "message") return;
    if(d.id) QC.dernierId = d.id;
    const code = String(d.message || "").trim().toUpperCase();
    if(METHODES.some(m => m.id === code)) recevoirCas(code);
  };
  es.onerror = () => {
    QC.etat = navigator.onLine === false ? "deconnecte" : "connexion"; majEtatQC();
    if(es.readyState === 2){ clearTimeout(QC.relance); QC.relance = setTimeout(() => { if(nomRoute() === "quelcas" && QC.vue === "affichage") ouvrirFluxQC(); }, 3000); }
  };
}
function fermerFluxQC(){ clearTimeout(QC.relance); if(QC.es){ try{ QC.es.close(); }catch(e){} } QC.es = null; QC.etat = "ferme"; }
function histoQC(){ const h = store.get("quelcasHisto", []); return Array.isArray(h) ? h : []; }
function recevoirCas(code){
  const h = histoQC(); h.unshift({ code, date:new Date().toISOString() }); store.set("quelcasHisto", h.slice(0, 10));
  QC.affiche = code;
  const m = METHODES.find(x => x.id === code);
  if(nomRoute() === "quelcas" && QC.vue === "affichage"){ renderAffichageQC(); toast("Nouveau cas : " + code + (m ? ", " + m.titre : "")); }
}

/* ---------- Vues ---------- */
function etatTexteQC(){
  const n = fileQC().length;
  if(QC.vue === "affichage"){
    if(navigator.onLine === false) return ["deconnecte", "Déconnecté : en attente du réseau"];
    return QC.etat === "connecte" ? ["connecte", "Connecté, en écoute"] : QC.etat === "connexion" ? ["attente", "Connexion en cours..."] : ["deconnecte", "Déconnecté"];
  }
  if(n) return ["attente", "File d'attente : " + n + " code" + (n > 1 ? "s" : "") + " à envoyer"];
  if(navigator.onLine === false || QC.dernierEnvoiOk === false) return ["deconnecte", "Déconnecté : les codes seront envoyés au retour du réseau"];
  return ["connecte", "Connecté"];
}
function majEtatQC(){
  const b = $("#qc-etat"); if(!b) return;
  const [cls, txt] = etatTexteQC();
  b.className = "qc-etat " + cls; b.textContent = txt;
}
function blocTopicQC(){
  if(store.get("topicPartage", false)) return "";
  return '<div class="carte qc-topic"><h3>Relier tes deux appareils</h3>'+
    '<p>Les deux appareils doivent utiliser le même topic. Copie celui-ci, puis colle-le sur l\'autre appareil dans <b>Réglages, rubrique « Quel cas ? »</b>.</p>'+
    '<p class="qc-topic-val">'+esc(topicQC())+'</p>'+
    '<div class="flex"><button class="btn btn-bleu" data-action="copierTopic">'+ic("copier")+'Copier le topic</button><button class="btn" data-go="reglages">Coller un topic reçu</button><button class="btn" data-action="topicOk">C\'est fait</button></div></div>';
}
function rQuelCas(vue){
  if(vue !== "saisie" && vue !== "affichage") vue = window.innerWidth > 900 ? "affichage" : "saisie";
  QC.vue = vue;
  const onglet = (v, lib) => '<button class="qc-onglet" data-go="quelcas/'+v+'" aria-pressed="'+(vue === v)+'">'+lib+'</button>';
  E().innerHTML = '<div class="entete"><button class="btn-icone" data-go="methodes" aria-label="Retour aux méthodes">'+ic("retour")+'</button><h1>Quel cas ?</h1></div>'+
    '<div class="contenu qc">'+
    '<div class="qc-onglets" role="group" aria-label="Vue">'+onglet("saisie","Saisie")+onglet("affichage","Affichage")+'</div>'+
    '<div class="qc-etat" id="qc-etat" role="status"></div>'+
    blocTopicQC()+
    '<div id="qc-vue"></div></div>';
  if(vue === "saisie"){ fermerFluxQC(); renderSaisieQC(); viderFileQC(); }
  else { ouvrirFluxQC(); if(!QC.affiche){ const h = histoQC(); if(h[0]) QC.affiche = h[0].code; } renderAffichageQC(); }
  majEtatQC();
}
function renderSaisieQC(){
  const z = $("#qc-vue"); if(!z) return;
  z.innerHTML = '<label class="sr" for="qc-champ">Mots de la question</label>'+
    '<input id="qc-champ" class="qc-champ" type="text" autocomplete="off" spellcheck="false" placeholder="Tape quelques mots de la question..." enterkeyhint="send">'+
    '<div id="qc-envoye" class="qc-envoye" aria-live="polite"></div>'+
    '<div id="qc-sugg" class="qc-sugg"></div>'+
    '<h3 class="qc-sous">Envoi direct</h3>'+
    '<div class="qc-codes">'+METHODES.map(m => '<button class="qc-code" data-action="envoyerCodeQC" data-arg="'+m.id+'" title="'+esc(m.titre)+'">'+m.id+'</button>').join("")+'</div>'+
    '<p class="muet petit">Seul le code du cas (par exemple T3) est envoyé, via ntfy.sh. Le texte que tu tapes reste sur ce téléphone.</p>';
  const c = $("#qc-champ");
  c.addEventListener("input", () => afficherSuggQC(c.value));
  c.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); const r = chercherCas(c.value); if(r[0]) envoyerDepuisSaisie(r[0].id); else toast("Aucun cas trouvé : utilise la grille."); } });
  setTimeout(() => c.focus(), 50);
}
function afficherSuggQC(v){
  const s = $("#qc-sugg"); if(!s) return;
  const r = chercherCas(v);
  s.innerHTML = !v.trim() ? "" : r.length ? r.map((m, i) => '<button class="qc-sugg-item'+(i === 0 ? " premier" : "")+'" data-action="envoyerCodeQC" data-arg="'+m.id+'"><span class="meth-id">'+m.id+(i === 0 ? " · Entrée" : "")+'</span><span class="qc-sugg-titre">'+esc(m.titre)+'</span></button>').join("") : '<p class="muet">Aucun cas trouvé. Essaie un autre mot, ou la grille ci-dessous.</p>';
}
async function envoyerDepuisSaisie(code){
  const ok = await envoyerCode(code);
  const e = $("#qc-envoye"), c = $("#qc-champ");
  if(e){ e.textContent = ok ? "Envoyé ✓ " + code : "En file d'attente : " + code; e.classList.add("visible"); setTimeout(() => { e.classList.remove("visible"); e.textContent = ""; }, 1000); }
  if(c){ c.value = ""; afficherSuggQC(""); c.focus(); }
  majEtatQC();
}
function renderAffichageQC(){
  const z = $("#qc-vue"); if(!z) return;
  const m = METHODES.find(x => x.id === QC.affiche), h = histoQC();
  const histo = h.length ? '<div class="qc-histo"><h3 class="qc-sous">Derniers cas</h3><div class="flex">'+h.map(x => '<button class="chip" data-action="afficherCodeQC" data-arg="'+esc(x.code)+'" aria-pressed="'+(x.code === QC.affiche)+'">'+esc(x.code)+'</button>').join("")+'</div></div>' : "";
  if(!m){
    z.innerHTML = '<div class="carte qc-vide">'+ic("etapes")+'<h2>En attente d\'un cas</h2><p class="muet">Envoie un code depuis la vue Saisie de ton téléphone : il s\'affichera ici en grand.</p></div>'+histo;
    return;
  }
  const f = FAMILLES_METHODES.find(x => x.id === m.famille) || { nom:"" };
  z.innerHTML = '<div class="qc-affiche" id="qc-affiche">'+
    '<div class="ligne-titre"><span class="etiquette"><span class="anneau"></span>'+esc(f.nom)+' · '+m.id+'</span>'+
      '<button class="btn btn-petit" data-action="pleinEcranQC">'+ic("grille")+'Plein écran</button></div>'+
    '<h2 class="qc-titre">'+esc(m.titre)+'</h2>'+
    '<div class="annonce-meth"><p>« '+esc(annonceMethode(m))+' »</p><button class="btn btn-petit" data-action="copierAnnonce" data-arg="'+m.id+'">'+ic("copier")+'Copier</button></div>'+
    '<ol class="qc-etapes">'+m.etapes.map((e, i) => '<li><span class="etape-num">'+(i+1)+'</span><span><b>'+esc(e[0])+'</b><span class="qc-mc">'+esc(String(e[1]||"").split("|").join(" · "))+'</span></span></li>').join("")+'</ol>'+
    '<div class="fb-bloc ton-orange"><h4>'+ic("eclair")+'Piège à éviter</h4><p>'+esc(m.piege||"")+'</p></div>'+
    '<div class="fb-bloc ton-vert"><h4>'+ic("drapeau")+'Conclusion</h4><p>« '+esc(m.conclusion||"")+' »</p></div>'+
  '</div>'+histo;
}
function blocReglagesQC(){
  return '<div class="carte groupe"><h3>Quel cas ? (synchronisation)</h3>'+
    '<p class="muet petit">Relie ton téléphone (Saisie) et ton ordinateur (Affichage). Les deux appareils doivent avoir le même topic. Seul le code du cas transite par ntfy.sh.</p>'+
    '<label class="champ">Topic de cet appareil<input id="rg-topic-actuel" value="'+esc(topicQC())+'" readonly></label>'+
    '<div class="flex"><button class="btn" data-action="copierTopic">'+ic("copier")+'Copier</button></div>'+
    '<label class="champ">Coller le topic de l\'autre appareil<input id="rg-topic" placeholder="harnais-..." autocomplete="off" spellcheck="false"></label>'+
    '<button class="btn btn-bleu" data-action="collerTopic">Utiliser ce topic</button></div>';
}
Object.assign(ACTIONS, {
  envoyerCodeQC(el){ envoyerDepuisSaisie(el.dataset.arg); },
  afficherCodeQC(el){ QC.affiche = el.dataset.arg; renderAffichageQC(); },
  copierTopic(){ copier(topicQC()); store.set("topicPartage", true); },
  topicOk(){ store.set("topicPartage", true); const b = $(".qc-topic"); if(b) b.remove(); },
  collerTopic(){
    const v = ($("#rg-topic").value || "").trim();
    if(!topicValide(v)){ toast("Topic invalide : 8 à 64 caractères, lettres, chiffres, tirets."); return; }
    store.set("topic", v); store.set("topicPartage", true); QC.dernierId = null; fermerFluxQC();
    $("#rg-topic-actuel").value = v; $("#rg-topic").value = ""; toast("Topic enregistré : les deux appareils sont reliés.");
  },
  pleinEcranQC(){
    const el = $("#qc-affiche") || document.documentElement;
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else if(el.requestFullscreen) el.requestFullscreen().catch(() => toast("Plein écran refusé par le navigateur."));
      else toast("Plein écran indisponible sur ce navigateur.");
    }catch(e){ toast("Plein écran indisponible sur ce navigateur."); }
  }
});

/* ---------- Méthodes : liste des cas d'usage et feuille stepper ---------- */
function methodesFaites(){ const o = store.get("methodes", {}); return (o && typeof o === "object") ? o : {}; }
function rMethodes(){
  const fait = methodesFaites(), nb = METHODES.filter(m => fait[m.id]).length;
  E().innerHTML = '<div class="entete entete-meth"><h1>Méthodes</h1><button class="btn btn-bleu" data-go="quelcas">'+ic("etapes")+'Quel cas ?</button></div><div class="contenu">'+
    '<div class="carte regles-or"><span class="etiquette"><span class="anneau"></span>Règles d\'or</span>'+
      '<ol class="regles">'+REGLES_OR.map(r => '<li>'+esc(r)+'</li>').join("")+'</ol></div>'+
    '<p class="muet">Une méthode par cas, en étapes, pour restituer sans improviser. '+nb+' sur '+METHODES.length+' révisée'+(nb > 1 ? "s" : "")+'.</p>'+
    FAMILLES_METHODES.map(f => '<section class="famille-meth"><h2>'+ic(f.ic)+esc(f.nom)+'</h2><div class="grille-meth">'+
      METHODES.filter(m => m.famille === f.id).map(m => '<button class="carte-meth'+(fait[m.id] ? " revisee" : "")+'" data-action="ouvrirMethode" data-arg="'+m.id+'">'+
        '<span class="meth-haut"><span class="meth-id">'+m.id+'</span>'+(fait[m.id] ? '<span class="meth-ok" role="img" aria-label="Révisée">'+ic("coche")+'</span>' : "")+'</span>'+
        '<span class="meth-titre">'+esc(m.titre)+'</span><span class="meth-info">'+m.etapes.length+' étapes</span></button>').join("")+
    '</div></section>').join("")+
  '</div>';
}
function feuilleMethode(id, revision){
  const m = METHODES.find(x => x.id === id); if(!m) return;
  const f = FAMILLES_METHODES.find(x => x.id === m.famille) || { nom:"" }, fait = !!methodesFaites()[id];
  const etapes = m.etapes.map((e, i) => {
    const mc = String(e[1]||"").split("|").filter(Boolean).map(k => '<span class="puce">'+esc(k)+'</span>').join("");
    return '<li class="etape"><button class="etape-btn" data-action="etapeMethode" aria-expanded="false">'+
      '<span class="etape-num" aria-hidden="true">'+(i+1)+'</span><span class="etape-corps">'+
      '<span class="etape-titre"><span class="sr">Étape '+(i+1)+' : </span>'+esc(e[0])+'</span>'+
      '<span class="etape-cache">Touche pour révéler les mots-clés</span>'+
      '<span class="puces etape-mc">'+mc+'</span>'+
      '<span class="etape-dev">'+esc(e[2]||"")+'</span></span></button></li>';
  }).join("");
  ouvrirModale('<div class="feuille-meth'+(revision ? " revision" : "")+'" data-id="'+m.id+'">'+
    '<div class="ligne-titre"><span class="etiquette"><span class="anneau"></span>'+esc(f.nom)+' · '+m.id+'</span>'+
      '<button class="btn-icone" data-action="fermerFeuille" aria-label="Fermer">'+ic("retour")+'</button></div>'+
    '<h2>'+esc(m.titre)+'</h2>'+
    '<div class="annonce-meth"><p>« '+esc(annonceMethode(m))+' »</p>'+
      '<button class="btn btn-petit" data-action="copierAnnonce" data-arg="'+m.id+'">'+ic("copier")+'Copier la phrase d\'annonce</button></div>'+
    (revision ? '<p class="muet petit">Mode révision : récite les mots-clés de chaque étape, puis touche-la pour vérifier.</p>' : '<p class="muet petit">Touche une étape pour lire sa phrase de développement.</p>')+
    '<ol class="stepper">'+etapes+'</ol>'+
    '<div class="fb-bloc ton-orange"><h4>'+ic("eclair")+'Piège à éviter</h4><p>'+esc(m.piege||"")+'</p></div>'+
    '<div class="fb-bloc ton-vert"><h4>'+ic("drapeau")+'Conclusion</h4><p>« '+esc(m.conclusion||"")+' »</p></div>'+
    '<div class="flex actions-meth"><button class="btn" data-action="revisionMethode" aria-pressed="'+(!!revision)+'">'+ic("oeil")+(revision ? "Quitter le mode révision" : "Mode révision")+'</button>'+
      '<button class="btn '+(fait ? "" : "btn-bleu")+'" data-action="marquerMethode" aria-pressed="'+fait+'">'+ic("coche")+(fait ? "Révisé, annuler" : "Marquer révisé")+'</button></div>'+
  '</div>');
  const h = $("#modale-boite h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus(); }
}
Object.assign(ACTIONS, {
  ouvrirQuelCas(){ go("quelcas"); },
  ouvrirMethode(el){ feuilleMethode(el.dataset.arg, false); },
  fermerFeuille(){ fermerModale(); },
  etapeMethode(el){
    const li = el.closest(".etape"), rev = !!el.closest(".revision");
    const cls = rev ? "revele" : "ouvert", on = !li.classList.contains(cls);
    li.classList.toggle(cls, on); el.setAttribute("aria-expanded", String(on));
  },
  copierAnnonce(el){ const m = METHODES.find(x => x.id === el.dataset.arg); if(m) copier(annonceMethode(m)); },
  revisionMethode(){ const f = $(".feuille-meth"); if(f) feuilleMethode(f.dataset.id, !f.classList.contains("revision")); },
  marquerMethode(){
    const f = $(".feuille-meth"); if(!f) return;
    const id = f.dataset.id, o = methodesFaites();
    if(o[id]) delete o[id]; else o[id] = new Date().toISOString();
    store.set("methodes", o);
    if(o[id]) toast("Méthode marquée révisée.");
    feuilleMethode(id, f.classList.contains("revision"));
    if(nomRoute() === "methodes") rMethodes();
  }
});
init();
/* PWA : service worker (installation sur l'écran d'accueil, ouverture hors ligne). Ignoré si la page est ouverte en fichier local. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
