  const plan = planifier(S, texte, ev, meta);
  S.attente = true; S.attenteDepuis = Date.now(); renderFil();

    try{ obj = await appelEntretien(S, plan); texteM = sansTiret(obj.manager_message.trim()); if(obj.feedback) fb = fusionFeedback(ev, obj.feedback); }
    catch(e){ gemErr = e; }
  } else if(reglages().fournisseur === "gemini" && cleApi() && Date.now() < GEM.localJusqua){
    gemErr = { message:"Mode local (quota gratuit) encore "+Math.ceil((GEM.localJusqua-Date.now())/60000)+" min." , type:"quota" };
  }
  clearInterval(tAttente); S && (S.attenteDepuis = 0);
  if(!S || S.fini) return;
  let fin = plan.kind === "fin";
  if(texteM){
    if(plan.kind === "question") suivreQuestionGemini(S, plan, obj, texteM);
    if(obj.phase_suivante === "cloture" && phaseCourante(S).kind === "questions_au_recruteur" && S.recruteurN >= 1) fin = true;
  } else {
    texteM = plan.texte; appliquerPlan(S, plan);
  }
  if(S.hist.length && S.hist[S.hist.length-1].role === "user") S.hist.push({ role:"model", parts:[{ text: JSON.stringify({ manager_message:texteM }) }] });
  /* gamification */
  const xp = Math.round(fb.note*10) + (ev.nbChiffres ? 5 : 0) + (ev.starComplet ? 5 : 0) + (ev.nbRemp === 0 ? 5 : 0) + (S.lang === "en" ? 5 : 0);
  fb.xp = xp; ajouterXP(xp); S.xpRound += xp; S.notes.push(fb.note);
  msg.fb = fb;
  const d = majDefi(S.manager, fb.note);

  const rec = { id:uid(), date:new Date().toISOString(), sessionId:S.cle, round:roundCourant(S), module: q ? q.module : S.module, questionId: q ? q.id : null, type: q ? q.type : "question",
    question: questionTexte, texte, lang:S.lang, scores:fb.scores, note:fb.note, source:fb.source, wpm:ev.wpm, rempMin:ev.rempMin, nbRemp:ev.nbRemp, tics:ev.tics, nbChiffres:ev.nbChiffres, nw:ev.nw, xp, manquants:ev.manquants };
  enregistrerReponse(rec); S.reps.push(rec);
  Object.assign(msg, { qId: q ? q.id : null, question: questionTexte, lang: S.lang, recId: rec.id });
  if(gemErr && gemErr.type !== "refus") S.msgs.push({ qui:"sys", texte:gemErr.message });
  if(d.apres >= 100 && d.avant < 100) S.msgs.push({ qui:"sys", texte:MANAGERS[S.manager].court+" vaincu : barre de défi à 100." });
  S.msgs.push({ qui:"m", texte:texteM });
  S.attente = false; S.debutQuestion = Date.now(); S.debutFrappe = 0; S.chronoAverti = false;

/* Réponse modèle : générée par Gemini si possible, sinon trame locale à partir des points attendus et des projets */
async function lancerReponseModele(i){
  const s = S; if(!s) return;
  const m = s.msgs[i]; if(!m || !m.fb || m.fb.rmEnCours || m.fb.reponse_modele) return;

  if(geminiActif()){
    m.fb.rmEnCours = true; majCarteFb(s, i);

    catch(e){ r = correctionLocale(q, question, m.texte, m.fb, lang); if(r) r.erreur = (e && e.message) || "Gemini indisponible."; }
    m.fb.rmEnCours = false;
  } else r = correctionLocale(q, question, m.texte, m.fb, lang);
  if(!r){ if(S === s) toast("Pas de réponse modèle disponible pour cette question."); majCarteFb(s, i); return; }

function passer(){

  S.skips++;
  S.msgs.push({ qui:"sys", texte:"Question passée." });
  const plan = prochaineQuestion(S, false);
  appliquerPlan(S, plan);
  S.hist.push({ role:"user", parts:[{ text:"(Le candidat passe la question.)" }] }, { role:"model", parts:[{ text: JSON.stringify({ manager_message:plan.texte }) }] });
  S.msgs.push({ qui:"m", texte:plan.texte }); S.debutQuestion = Date.now(); S.debutFrappe = 0; S.chronoAverti = false;

function indice(){
  if(!S || S.fini) return;
  const q = questionCourante(S);
  if(!q || !q.attendu.length){ toast("Pas d'indice pour cette question."); return; }
  const n = norm($("#saisie") ? $("#saisie").value : "");
  const a = q.attendu.find(x => !x.mots_cles.some(k => n.includes(norm(k)))) || q.attendu[0];

  S.msgs.push({ qui:"sys", texte:"Indice (moins 5 XP) : pense à « "+a.point+" », par exemple avec le mot « "+a.mots_cles[0]+" »." });
  renderFil(); sauverEncours();
}

    const ecritLong = !VOIX.ecoute && S.debutFrappe && (Date.now() - S.debutFrappe) * VITESSE > 60000 && ta.value.trim();

const AXES = { structure:"Structure davantage en STAR : situation datée, ton action, résultat chiffré, leçon.", precision:"Cite les éléments techniques attendus (paramètres, méthode de recette, seuils statistiques).", impact:"Ajoute systématiquement l'impact business : conversion, chiffre d'affaires, coût, décision.", clarte:"Réduis les mots de remplissage et les tics : marque une pause silencieuse à la place.", concision:"Vise 60 à 180 mots : réponse d'abord, détails ensuite." };

function debriefLocal(reps){
  if(!reps.length) return { score_global:0, forces:["Aucune réponse enregistrée dans ce round."], axes:["Réponds à au moins une question pour obtenir un débrief."], exercice_demain:"Lancer un round complet.", phrase_cle:CLES.structure, source:"local" };

  const forces = tri.slice(0,3).map(([k,v]) => FORCES[k]+" ("+v+"/5)");
  const axes = tri.slice(-3).reverse().map(([k,v]) => AXES[k]+" ("+v+"/5)");
  const tics = {}; reps.forEach(r => (r.tics||[]).forEach(t => { tics[t.dit] = (tics[t.dit]||0) + (t.n||1); }));

/* ---------- Progression ---------- */
function graphLigne(vals){
  if(!vals.length) return '<p class="muet">Pas encore de session terminée.</p>';
  const W=440,H=180,pl=30,pr=12,pt=12,pb=24, x = i => pl + (vals.length===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(vals.length-1)), y = v => pt + (5-v)*(H-pt-pb)/5;
  let g = "";
  for(let v=0; v<=5; v++) g += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--ligne)"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const pts = vals.map((v,i) => x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  return '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Score par session, du plus ancien au plus récent : '+vals.join(", ")+'">'+g+
    '<polyline points="'+pts+'" fill="none" stroke="var(--bleu)" stroke-width="2.5" stroke-linejoin="round"/>'+vals.map((v,i) => '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="var(--bleu)"/>').join("")+
    '<text x="'+pl+'" y="'+(H-6)+'">ancien</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">récent</text></svg>';
}
function graphRadar(m){
  const k = Object.keys(LIB_CRIT), cx=150, cy=125, R=88;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/k.length; return [cx + Math.cos(a)*R*v/5, cy + Math.sin(a)*R*v/5]; };
  let g = "";
  [1,2,3,4,5].forEach(v => { g += '<polygon points="'+k.map((_,i) => pt(i,v).join(",")).join(" ")+'" fill="none" stroke="var(--ligne)"/>'; });
  k.forEach((c,i) => { const [x2,y2] = pt(i,5), [lx,ly] = pt(i,6.3); g += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--ligne)"/><text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle">'+LIB_CRIT[c].split(" ")[0]+' '+m[c]+'</text>'; });
  return '<svg class="graph" viewBox="0 0 300 250" role="img" aria-label="Radar des critères : '+k.map(c => LIB_CRIT[c]+" "+m[c]).join(", ")+'">'+g+
    '<polygon points="'+k.map((c,i) => pt(i, m[c]).join(",")).join(" ")+'" fill="rgba(31,111,224,.28)" stroke="var(--bleu)" stroke-width="2"/></svg>';
}
function rProgression(){
  const rep = store.get("reponses", []), sess = store.get("sessions", []), xp = store.get("xp", 0), obt = store.get("badges", {});
  const il7 = Date.now() - 7*86400000, r7 = rep.filter(r => new Date(r.date).getTime() >= il7);
  const wp = rep.filter(r => r.wpm).map(r => r.wpm), rm = rep.filter(r => r.rempMin != null).map(r => r.rempMin);
  const ticsRest = new Set(); rep.slice(-10).forEach(r => (r.tics||[]).forEach(t => ticsRest.add(t.dit)));
  const roundsOk = sess.filter(s => s.complet && s.round).length;
  const vals = sess.filter(s => s.nb > 0).slice(-20).map(s => s.scoreMoyen);
  const m = moyennesCriteres(rep.slice(-30));
  const modsQ = MODULES.filter(x => !x.special);
  const chal = modsQ.map(md => { const v = rep.filter(r => r.module === md.id).map(r => r.note); const s = v.length ? r1(moy(v)) : null;
    const a = s == null ? 0 : 0.15 + s/5*0.75; const fonce = a > 0.55;
    return '<div style="background:'+(s==null ? "var(--fond2)" : "rgba(31,111,224,"+a.toFixed(2)+")")+';color:'+(fonce ? "#fff" : "var(--txt)")+'"><span>'+esc(md.nom)+'</span><b>'+(s==null ? "pas de donnée" : s+"/5 ("+v.length+")")+'</b></div>'; }).join("");
  /* à travailler */
  const travail = [];
  if(rep.length){
    const faible = Object.entries(m).sort((a,b)=>a[1]-b[1])[0]; if(faible[1] < 3.5) travail.push(LIB_CRIT[faible[0]]+" ("+faible[1]+"/5 sur les 30 dernières réponses) : "+AXES[faible[0]]);
    const tc = {}; rep.slice(-30).forEach(r => (r.tics||[]).forEach(t => tc[t.dit] = (tc[t.dit]||0) + (t.n||1)));
    const tt = Object.entries(tc).sort((a,b)=>b[1]-a[1])[0]; if(tt){ const t = TICS_FR.find(x => x.dit === tt[0]); travail.push("Tic « "+tt[0]+" » ("+tt[1]+" fois récemment) : dis plutôt "+(t ? t.propose : "une formulation précise")+"."); }
    const mods = modsQ.map(md => { const v = rep.filter(r => r.module === md.id).map(r => r.note); return [md.nom, v.length >= 2 ? moy(v) : null]; }).filter(x => x[1] != null).sort((a,b)=>a[1]-b[1])[0];
    if(mods && mods[1] < 3.5 && travail.length < 3) travail.push("Module « "+mods[0]+" » ("+r1(mods[1])+"/5) : refais une série de 5 questions.");
    const mq = {}; rep.slice(-30).forEach(r => (r.manquants||[]).forEach(p => mq[p] = (mq[p]||0)+1));
    const pm = Object.entries(mq).sort((a,b)=>b[1]-a[1])[0]; if(pm && travail.length < 3) travail.push("Point souvent oublié : « "+pm[0]+" » ("+pm[1]+" fois).");
  }
  /* classement personnel */
  const best = {};
  sess.forEach(s => { const k = s.round ? "Round "+s.round : (s.titre||"Libre").split(" · ")[0]; if(s.nb && (best[k] == null || s.scoreMoyen > best[k])) best[k] = s.scoreMoyen; });
  const bestMod = {}; rep.forEach(r => { const k = nomModule(r.module); if(bestMod[k] == null || r.note > bestMod[k]) bestMod[k] = r.note; });
  E().innerHTML = '<div class="entete"><h1>Progression</h1></div><div class="contenu grille-desk">'+
   '<div class="bento pleine">'+
    '<div class="tuile"><span class="val">'+roundsOk+'</span><span class="lib">rounds complétés</span></div>'+
    '<div class="tuile"><span class="val">'+(r7.length ? r1(moy(r7.map(r=>r.note))) : "n/d")+'</span><span class="lib">score moyen sur 7 jours</span></div>'+
    '<div class="tuile"><span class="val">'+serieCourante()+'</span><span class="lib">jours de série</span></div>'+
    '<div class="tuile"><span class="val">'+(wp.length ? Math.round(moy(wp)) : "n/d")+'</span><span class="lib">mots par minute (moyenne)</span></div>'+
    '<div class="tuile"><span class="val">'+(rm.length ? r1(moy(rm)) : "n/d")+'</span><span class="lib">mots de remplissage par minute</span></div>'+
    '<div class="tuile"><span class="val">'+ticsRest.size+'</span><span class="lib">tics restants à corriger</span></div>'+
    '<div class="tuile large"><span class="lib">Niveau</span><span class="val">'+niveau(xp)+' · '+xp+' XP</span><div class="barre" aria-hidden="true"><i style="width:'+(xp > 1500 ? 100 : xp > 500 ? (xp-500)/10 : xp/5)+'%"></i></div></div>'+
   '</div>'+
   '<div class="carte"><h3>Score par session</h3>'+graphLigne(vals)+'</div>'+
   '<div class="carte"><h3>Les 5 critères (30 dernières réponses)</h3>'+(rep.length ? graphRadar(m) : '<p class="muet">Pas encore de réponse.</p>')+'</div>'+
   '<div class="carte"><h3>Modules</h3><div class="chaleur">'+chal+'</div></div>'+
   '<div class="carte"><h3>À travailler</h3>'+(travail.length ? '<ul class="prose">'+travail.slice(0,3).map(t => '<li>'+esc(t)+'</li>').join("")+'</ul>' : '<p class="muet">Réponds à quelques questions pour obtenir des priorités.</p>')+'</div>'+
   '<div class="carte"><h3>Barres de défi</h3>'+["A","B","C"].map(k => '<div class="critere"><span>'+MANAGERS[k].court+'</span><div class="barre"><i style="width:'+defis()[k]+'%"></i></div><b>'+defis()[k]+'</b></div>').join("")+'</div>'+
   '<div class="carte"><h3>Badges</h3><div class="badges">'+BADGES.map(b => '<div class="badge'+(obt[b.id]?" obtenu":"")+'" title="'+esc(b.desc)+'">'+ic("etoile")+'<span><b>'+esc(b.nom)+'</b><br><span class="petit">'+(obt[b.id] ? "obtenu" : esc(b.desc))+'</span></span></div>').join("")+'</div></div>'+
   '<div class="carte"><h3>Classement personnel</h3>'+(Object.keys(best).length || Object.keys(bestMod).length ?
     '<table class="tab"><thead><tr><th>Type</th><th>Meilleur score</th></tr></thead><tbody>'+Object.entries(best).map(([k,v]) => '<tr><td>'+esc(k)+'</td><td>'+v+'/5</td></tr>').join("")+Object.entries(bestMod).map(([k,v]) => '<tr><td>Module '+esc(k)+'</td><td>'+v+'/5</td></tr>').join("")+'</tbody></table>' : '<p class="muet">Aucun score pour l\'instant.</p>')+'</div>'+
  '</div>';
}

async function genererCas(){
  const secteurs = ["automobile","mobilité","industrie B2B","média et divertissement","distribution","tourisme"];
  const sec = secteurs[Math.floor(Math.random()*secteurs.length)];
  toast("Génération du cas en cours...");
  const sys = "Tu génères des cas pratiques d'entretien pour un poste de Digital Analytics Consultant chez fifty-five (équipe automobile, mobilité, industrie, média et divertissement). Réponds uniquement avec un objet JSON valide : {\"titre\": \"...\", \"secteur\": \"...\", \"enonce\": \"3 à 5 phrases qui posent un problème mesurable, avec des chiffres présentés comme fictifs\"}. Pas de tiret long, pas de markdown. Le cas doit demander un diagnostic puis une recommandation.";
  try{
    const { obj } = await geminiJSON(sys, [{ role:"user", parts:[{ text:"Génère un nouveau cas pour le secteur : "+sec+". Évite ces cas déjà connus : "+QB.filter(q => q.module === "cas").map(q => q.enonce.slice(0,70)).join(" | ") }] }], { temperature:0.9, delai:60000 });
    if(!obj || typeof obj.enonce !== "string" || obj.enonce.length < 30) throw new ErrGem("json","Cas généré invalide, réessaie ou tire un cas de la banque.");
    const id = "gen-"+uid();
    const q = { id, module:"cas", round:0, niveau:"junior", type:"cas", enonce:sansTiret((obj.titre ? obj.titre+" : " : "")+obj.enonce), tags:["cas","genere"], attendu:parseAttendu(CAS_ATTENDU), pieges:[] };
    lancerLibre("cas", 1, [id], { [id]:q }, "Cas généré · "+sansTiret(obj.secteur || sec));
  }catch(e){ toast(e.message || "Génération impossible."); }
}

function rVocab(){
  E().innerHTML = entete("Vocabulaire FR")+'<div class="contenu">'+

}
function quizVocab(){
  const items = [];
  TICS_FR.concat(SUGGESTIONS_FR).forEach(t => items.push({ q:"Que dire à la place de « "+t.dit+" » ?", ok:t.propose, tic:true }));
  GLOSSAIRE.forEach(([a,b]) => items.push({ q:"Quel terme correspond à : "+b, ok:a }));
  const sel = melanger(items).slice(0,8);
  QUIZ = { items: sel.map(it => { const pool = items.filter(x => x.tic === it.tic && x.ok !== it.ok).map(x => x.ok); return Object.assign({}, it, { choix: melanger([it.ok].concat(melanger(pool).slice(0,2))) }); }), i:0, bons:0 };
  afficherQuiz();
}
function afficherQuiz(){
  const z = $("#quiz"); if(!z || !QUIZ) return;
  if(QUIZ.i >= QUIZ.items.length){
    const xp = QUIZ.bons*2; ajouterXP(xp); marquerJour();
    z.innerHTML = '<p><b>'+QUIZ.bons+'/'+QUIZ.items.length+'</b> bonnes réponses, +'+xp+' XP.</p><button class="btn" data-action="quizVocab">Recommencer</button>'; QUIZ = null; return;
  }
  const it = QUIZ.items[QUIZ.i];
  z.innerHTML = '<p style="font-weight:700">'+(QUIZ.i+1)+'. '+esc(it.q)+'</p>'+it.choix.map((c,j) => '<button class="btn" data-action="repQuiz" data-arg="'+j+'">'+esc(c)+'</button>').join("");
}
function repQuiz(j){
  const it = QUIZ.items[QUIZ.i], bon = it.choix[j] === it.ok;
  if(bon){ QUIZ.bons++; if(it.tic) majStats({ ticsCorriges: stats().ticsCorriges + 1 }); }
  toast(bon ? "Exact." : "Réponse attendue : "+it.ok);
  QUIZ.i++; afficherQuiz();
}

  $$(".atelier [data-i]").forEach(el => el.addEventListener("change", () => { const p = planCourant(); p[+el.dataset.i][el.dataset.k] = el.value; store.set("plan", p); }));
}
function validerPlan(plan){
  const msgs = [], noms = {};
  const SUSPECTS = ["email","mail","phone","telephone","tel","nom","prenom","firstname","lastname","adresse","address","ip","iban","street","rue"];
  const SUSPECTS_EXACTS = ["name","first_name","last_name","full_name","user_name","customer_name","birthdate","date_naissance"];
  plan.forEach((l,i) => {
    const L = "Ligne "+(i+1)+" ("+(l.nom||"sans nom")+") : ";
    const nom = (l.nom||"").trim();
    if(!nom) msgs.push([0, L+"nom manquant."]);
    else {
      if(!/^[a-z][a-z0-9_]*$/.test(nom)) msgs.push([0, L+"le nom doit être en minuscules, avec des underscores, sans accent ni espace, et commencer par une lettre."]);
      if(nom.length > 40) msgs.push([0, L+"nom trop long ("+nom.length+" caractères, limite GA4 : 40)."]);
      if(noms[nom] != null) msgs.push([0, L+"doublon du nom de la ligne "+(noms[nom]+1)+"."]); else noms[nom] = i;
    }
    const params = (l.params||"").split(",").map(x => x.trim()).filter(Boolean).map(x => x.split(":")[0].trim().toLowerCase());
    params.forEach(p => { const tok = p.split(/[_\-.]/); if(SUSPECTS_EXACTS.includes(p) || tok.some(t => SUSPECTS.includes(t))) msgs.push([0, L+"paramètre suspect « "+p+" » (donnée personnelle possible) : alerte RGPD, à retirer ou à pseudonymiser après avis du DPO."]); });
    if(params.length > 25) msgs.push([0, L+params.length+" paramètres : au-delà de 25 par événement, GA4 n'enregistre pas tout."]);
    if(/purchase|achat|transaction|order|commande/.test(nom)){ ["transaction_id","value","currency"].forEach(k => { if(!params.includes(k)) msgs.push([0, L+"événement d'achat sans « "+k+" »."]); }); }
    if(!(l.declencheur||"").trim()) msgs.push([0, L+"déclencheur manquant."]);
    else if(l.consent === "oui" && !/consent|cmp|accept|accord|categorie|catégorie/i.test(l.declencheur)) msgs.push([0, L+"soumis au consentement, mais le déclencheur ne précise pas la condition (exemple : si la catégorie mesure d'audience est acceptée)."]);
  });
  return msgs;
}
function exportPlan(sep){

function flashDeck(k){
  const st = store.get("flashcards", {}), auj = jourISO();
  let idx = FLASH_DECKS[k].cartes.map((c,i) => i).filter(i => { const e = st[k+":"+i]; return !e || e.due <= auj; });
  if(!idx.length){ toast("Rien à revoir aujourd'hui dans ce paquet."); return; }
  FLASH = { k, idx:melanger(idx).slice(0,15), i:0, verso:false, sus:0 }; afficherFlash();
}
function afficherFlash(){
  const z = $("#flash-zone"); if(!z || !FLASH) return;
  if(FLASH.i >= FLASH.idx.length){ ajouterXP(FLASH.sus); marquerJour(); z.innerHTML = '<div class="carte"><p>Paquet terminé : '+FLASH.sus+' sur '+FLASH.idx.length+' sus, +'+FLASH.sus+' XP.</p></div>'; FLASH = null; return; }
  const c = FLASH_DECKS[FLASH.k].cartes[FLASH.idx[FLASH.i]];
  z.innerHTML = '<div class="carte flash" aria-live="polite"><span class="muet">'+(FLASH.i+1)+' / '+FLASH.idx.length+'</span><span class="recto">'+esc(c.r)+'</span>'+(FLASH.verso ? '<span>'+esc(c.v)+'</span><div class="flex"><button class="btn btn-bleu" data-action="flashRep" data-arg="1">Je savais</button><button class="btn" data-action="flashRep" data-arg="0">Pas encore</button></div>' : '<button class="btn btn-bleu" data-action="flashVoir">Voir la réponse</button>')+'</div>';
}
function flashRep(su){
  const st = store.get("flashcards", {}), cle = FLASH.k+":"+FLASH.idx[FLASH.i], e = st[cle] || { interval:1 };
  const inter = su ? Math.max(1, Math.round((e.interval||1) * 2.5)) : 1;
  const d = new Date(); d.setDate(d.getDate() + inter);
  st[cle] = { interval:inter, due:jourISO(d) }; store.set("flashcards", st);
  if(su) FLASH.sus++;
  FLASH.i++; FLASH.verso = false; afficherFlash();
}

function importerFichier(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj; try{ obj = JSON.parse(rd.result); }catch(err){ toast("Fichier JSON invalide."); return; }
    if(!obj || obj.app !== "Harnais" || !obj.data){ toast("Ce fichier n'est pas un export Harnais."); return; }
    ouvrirModale('<h2>Importer des données</h2><p>'+Object.keys(obj.data).length+' clés trouvées (export du '+esc(new Date(obj.date).toLocaleString("fr-FR"))+').</p><div class="flex"><button class="btn btn-bleu" id="im-fus">Fusionner</button><button class="btn btn-danger" id="im-rem">Remplacer tout</button><button class="btn" id="im-non">Annuler</button></div>');
    $("#im-non").onclick = fermerModale;
    $("#im-fus").onclick = async () => { fermerModale(); if(await confirmer("Fusionner l'export avec les données actuelles ?","Fusionner")) appliquerImport(obj.data, false); };
    $("#im-rem").onclick = async () => { fermerModale(); if(await confirmer("Remplacer toutes les données actuelles par l'export ? Cette action efface l'existant.","Remplacer")) appliquerImport(obj.data, true); };
  };
  rd.readAsText(f); e.target.value = "";
}
function appliquerImport(data, remplacer){
  if(remplacer){ store.cles().forEach(k => { if(k !== "secrets.gemini" || data["secrets.gemini"] != null) store.del(k); }); Object.entries(data).forEach(([k,v]) => store.set(k, v)); }
  else Object.entries(data).forEach(([k,v]) => {
    const cur = store.get(k, null);
    if(Array.isArray(cur) && Array.isArray(v)){ const vus = new Set(cur.map(x => x && x.id ? x.id : JSON.stringify(x))); store.set(k, cur.concat(v.filter(x => !vus.has(x && x.id ? x.id : JSON.stringify(x))))); }
    else if(k === "xp") store.set(k, Math.max(Number(cur)||0, Number(v)||0));
    else if(k === "serie" && cur && v){ store.set(k, { jours:Array.from(new Set((cur.jours||[]).concat(v.jours||[]))).sort() }); }
    else if(cur && v && typeof cur === "object" && typeof v === "object" && !Array.isArray(v)) store.set(k, Object.assign({}, cur, v));
    else if(cur == null) store.set(k, v);
  });
  S = null; appliquerTheme(); toast("Import terminé."); go("accueil");
}

/* =====================================================================
   « Quel cas ? » : Saisie (téléphone) et Affichage (ordinateur), reliés par ntfy.sh
   Seul le code du cas (ex. « T3 ») part sur le réseau, jamais le texte saisi.
   ===================================================================== */
const TRIGGERS = [
  { code:"T1", mots:["projet","étapes","piloter","projet de tracking","mettre en place le tracking"] },
  { code:"T2", mots:["demande d'essai","devis","formulaire","essai","prise de rendez-vous"] },
  { code:"T3", mots:["écart","crm","remonte pas","ne remonte pas","différence de volume"] },
  { code:"T4", mots:["mise en production","chute","mise en prod","après la refonte","refonte"] },
  { code:"T5", mots:["doublon","deux fois","double","en double"] },
  { code:"T6", mots:["application","web","app","appli","site et application"] },
  { code:"C1", mots:["désaccord","technique","conflit","marketing et technique"] },
  { code:"C2", mots:["a/b","ab test","test ab","abandon","test a/b"] },
  { code:"C3", mots:["p-value","significatif","non concluant","0,12","0.12","pas significatif"] },
  { code:"C4", mots:["p-value","significatif","0,04","0.04","concluant"] },
  { code:"C5", mots:["tablette","mobile","segment","sous-performe","appareil"] },
  { code:"C6", mots:["hypothèse","formuler une hypothèse"] },
  { code:"C7", mots:["de 3 à 2,5","baisse de conversion","taux de conversion baisse","2,5 %","2,5%"] },
  { code:"K1", mots:["garanti","en un mois","promettre","garantie","promesse"] },
  { code:"K2", mots:["chiffre d'affaires","ventes","ca baisse","baisse du ca"] },
  { code:"K3", mots:["recommandation","recommander","que recommandes-tu"] },
  { code:"K4", mots:["dirigeant","comité","direction","codir","comex"] },
  { code:"K5", mots:["le site marche bien","marche bien","à quoi sert le tracking"] },
  { code:"A1", mots:["recette automatisee","recette par agent","rejouer les scenarios"] },
  { code:"A2", mots:["diagnostic par agent","hypotheses classees"] },
  { code:"A3", mots:["cookie","cookies","referentiel","crawl","luciol"] },
  { code:"A4", mots:["kpi","commentaire","e-mail","email","reporting"] },
  { code:"K6", mots:["pourquoi le conseil","conseil","pourquoi un cabinet"] }
];
function chercherCas(texte){
  const n = norm(texte).trim(); if(!n) return [];
  const direct = trouverItem(n.replace(/\s+/g,"").toUpperCase());
  if(direct) return [direct];
  const scores = TRIGGERS.map(t => {
    let s = 0;
    t.mots.forEach(w => { const k = norm(w); if(k && n.includes(k)) s += 1 + k.length / 10; });
    return { code:t.code, s };
  }).filter(x => x.s > 0);
  /* Combinaisons : « recette » + « agent » → A1, « baisse » + « agent » → A2 ; « IA », « agent » seuls → A1 à A4 */
  const mots = new Set(n.split(/[^a-z0-9]+/).filter(Boolean)), a = w => mots.has(w) || mots.has(w + "s");
  const ia = ["ia","ai","agent","agentique","agentic"].some(a);
  const bonus = (code, v) => { const x = scores.find(y => y.code === code); if(x) x.s += v; else scores.push({ code, s:v }); };
  if(a("agent") && a("recette")) bonus("A1", 20);
  if(a("agent") && (a("baisse") || a("drop"))) bonus("A2", 20);
  if(ia) ["A1","A2","A3","A4"].forEach((c, i) => bonus(c, 8 - i * 0.1));
  scores.sort((x,y) => y.s - x.s);
  return scores.slice(0, 4).map(x => trouverItem(x.code)).filter(Boolean);
}

/* ---------- Topic ntfy ---------- */
function nouveauTopic(){
  const al = "abcdefghijklmnopqrstuvwxyz0123456789"; let s = "";
  const b = new Uint8Array(20);
  try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<20;i++) b[i] = Math.floor(Math.random()*256); }
  b.forEach(x => s += al[x % al.length]);
  return "harnais-" + s;
}
function topicQC(){ return store.get("topic", ""); }
function topicValide(t){ return /^[A-Za-z0-9_-]{8,64}$/.test(t || ""); }
if(!topicQC()) store.set("topic", nouveauTopic()); /* premier lancement */

const QC = { es:null, etat:"ferme", dernierId:null, relance:null, envoiEnCours:false, dernierEnvoiOk:null };
function fileQC(){ const f = store.get("fileQuelCas", []); return Array.isArray(f) ? f : []; }
async function posterCode(code){
  const t = topicQC(); if(!topicValide(t)) throw new Error("topic");
  const r = await fetch("https://ntfy.sh/" + encodeURIComponent(t), { method:"POST", body:code, headers:{ "Content-Type":"text/plain" } });
  if(!r.ok) throw new Error("HTTP " + r.status);
}
/* Envoi dans l'ordre : on ajoute à la file, puis on vide la file une entrée à la fois */
async function envoyerCode(code){
  const f = fileQC(); f.push(code); store.set("fileQuelCas", f); majEtatQC();
  await viderFileQC();
  return fileQC().length === 0;
}
async function viderFileQC(){
  if(QC.envoiEnCours) return; QC.envoiEnCours = true;
  try{
    while(fileQC().length){
      const f = fileQC();
      try{ await posterCode(f[0]); QC.dernierEnvoiOk = true; }
      catch(e){ QC.dernierEnvoiOk = false; break; }
      const g = fileQC(); g.shift(); store.set("fileQuelCas", g);
    }
  } finally { QC.envoiEnCours = false; majEtatQC(); }
}
window.addEventListener("online", () => { viderFileQC(); if(nomRoute() === "quelcas") { majEtatQC(); if(QC.vue === "affichage") ouvrirFluxQC(); } });
window.addEventListener("offline", () => majEtatQC());
setInterval(() => { if(fileQC().length && navigator.onLine !== false) viderFileQC(); }, 8000);

/* Réception : flux SSE, reconnexion automatique, reprise depuis le dernier message reçu */
function ouvrirFluxQC(){
  const t = topicQC(); if(!topicValide(t)) return;
  if(QC.es && QC.es.readyState !== 2 && QC.esTopic === t) return;
  fermerFluxQC();
  const url = "https://ntfy.sh/" + encodeURIComponent(t) + "/sse" + (QC.dernierId ? "?since=" + encodeURIComponent(QC.dernierId) : "");
  let es;
  try{ es = new EventSource(url); }catch(e){ QC.etat = "deconnecte"; majEtatQC(); return; }
  QC.es = es; QC.esTopic = t; QC.etat = "connexion"; majEtatQC();
  es.onopen = () => { QC.etat = "connecte"; majEtatQC(); };
  es.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
    if(!d || d.event !== "message") return;
    if(d.id) QC.dernierId = d.id;
    const code = String(d.message || "").trim().toUpperCase();
    if(trouverItem(code)) recevoirCas(code);
  };
  es.onerror = () => {
    QC.etat = navigator.onLine === false ? "deconnecte" : "connexion"; majEtatQC();
    if(es.readyState === 2){ clearTimeout(QC.relance); QC.relance = setTimeout(() => { if(nomRoute() === "quelcas" && QC.vue === "affichage") ouvrirFluxQC(); }, 3000); }
  };
}
function fermerFluxQC(){ clearTimeout(QC.relance); if(QC.es){ try{ QC.es.close(); }catch(e){} } QC.es = null; QC.etat = "ferme"; }
function histoQC(){ const h = store.get("quelcasHisto", []); return Array.isArray(h) ? h : []; }
function recevoirCas(code){
  const h = histoQC(); h.unshift({ code, date:new Date().toISOString() }); store.set("quelcasHisto", h.slice(0, 10));
  QC.affiche = code;
  const m = trouverItem(code);
  if(nomRoute() === "quelcas" && QC.vue === "affichage"){ renderAffichageQC(); toast("Nouveau cas : " + code + (m ? ", " + m.titre : "")); }
}

function etatTexteQC(){
  const n = fileQC().length;
  if(QC.vue === "affichage"){
    if(navigator.onLine === false) return ["deconnecte", "Déconnecté : en attente du réseau"];
    return QC.etat === "connecte" ? ["connecte", "Connecté, en écoute"] : QC.etat === "connexion" ? ["attente", "Connexion en cours..."] : ["deconnecte", "Déconnecté"];
  }
  if(n) return ["attente", "File d'attente : " + n + " code" + (n > 1 ? "s" : "") + " à envoyer"];
  if(navigator.onLine === false || QC.dernierEnvoiOk === false) return ["deconnecte", "Déconnecté : les codes seront envoyés au retour du réseau"];
  return ["connecte", "Connecté"];
}
function majEtatQC(){
  const b = $("#qc-etat"); if(!b) return;
  const [cls, txt] = etatTexteQC();
  b.className = "qc-etat " + cls; b.textContent = txt;
}

/* Bascule portrait / paysage : on vérifie au changement de media query, au redimensionnement et à la rotation */
function verifierOrientationQC(){
  if(nomRoute() !== "quelcas" || QC.vue !== "saisie") return;

function rQuelCas(vue){

function vueBoutonsQC(){ return store.get("quelcasVue", "famille") === "codes" ? "codes" : "famille"; }
function famillesQC(){ return FAMILLES_METHODES.filter(f => f.id !== "ia").concat([{ id:"moi", nom:"Moi", ic:"personne" }, { id:"server", nom:"Server-side", ic:"globe" }]); }
function itemsFamilleQC(id){
  if(id === "moi") return MOI_ITEMS;
  if(id === "server") return SS_ITEMS.slice(0, 5).concat([METHODES.find(m => m.id === "T7")], SS_ITEMS.slice(5)).filter(Boolean);
  return METHODES.filter(m => m.famille === id);
}
function familleQC(){ const f = store.get("quelcasFamille", "tracking"); return famillesQC().some(x => x.id === f) ? f : "tracking"; }
const NOMS_ONGLETS_QC = { tracking:"Tracking", cro:"CRO, média", consulting:"Consulting", ia:"IA", moi:"Moi", server:"Server" };
function motsClesCas(code){
  const t = TRIGGERS.find(x => x.code === code); if(!t) return [];
  const vus = new Set(); return (langueMeth() === "en" ? (TRIGGERS_EN[code] || []) : (t.motsFR || t.mots)).filter(w => { const k = norm(w); if(vus.has(k) || [...vus].some(v => v.includes(k) || k.includes(v))) return false; vus.add(k); return true; }).slice(0, 4);
}

function afficherSuggQC(v){

  if(c){ c.value = ""; afficherSuggQC(""); c.focus(); }
  majEtatQC();
}

Object.assign(ACTIONS, {
  vueBoutonsQC(el){
    store.set("quelcasVue", el.dataset.arg === "codes" ? "codes" : "famille");
    const g = $("#qc-grille"); if(g) g.innerHTML = grilleQC();
    $$(".qc-bascule button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.arg === vueBoutonsQC())));
  },
  infoCasQC(el){ ficheCasQC(el.dataset.arg); },
  envoyerDepuisFicheQC(el){ const c = el.dataset.arg; fermerModale(); envoyerDepuisSaisie(c); },
  defEtapeQC(el){ const li = el.closest("li"); if(!li) return; const on = !li.classList.contains("def-ouverte"); li.classList.toggle("def-ouverte", on); el.setAttribute("aria-expanded", String(on)); },
  familleQC(el){ store.set("quelcasFamille", el.dataset.arg); const g = $("#qc-grille"); if(g) g.innerHTML = grilleQC(); },
  envoyerCodeQC(el){ envoyerDepuisSaisie(el.dataset.arg); },
  afficherCodeQC(el){ QC.affiche = el.dataset.arg; renderAffichageQC(); },
  copierTopic(){ copier(topicQC()); store.set("topicPartage", true); },
  topicOk(){ store.set("topicPartage", true); const b = $(".qc-topic"); if(b) b.remove(); },
  collerTopic(){
    const v = ($("#rg-topic").value || "").trim();
    if(!topicValide(v)){ toast("Topic invalide : 8 à 64 caractères, lettres, chiffres, tirets."); return; }
    store.set("topic", v); store.set("topicPartage", true); QC.dernierId = null; fermerFluxQC();
    $("#rg-topic-actuel").value = v; $("#rg-topic").value = ""; toast("Topic enregistré : les deux appareils sont reliés.");
  },
  pleinEcranQC(){
    const el = $("#qc-affiche") || document.documentElement;
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else if(el.requestFullscreen) el.requestFullscreen().catch(() => toast("Plein écran refusé par le navigateur."));
      else toast("Plein écran indisponible sur ce navigateur.");
    }catch(e){ toast("Plein écran indisponible sur ce navigateur."); }
  }
});

function notesCas(code){ const o = store.get("notesMethodes", {}); return (o && o[code]) || {}; }
function noteEtape(code, i){ return notesCas(code)[String(i)] || ""; }
function majNoteEtape(code, i, texte){
  const o = store.get("notesMethodes", {}) || {};
  o[code] = o[code] || {};
  if(texte.trim()) o[code][String(i)] = texte; else delete o[code][String(i)];
  if(!Object.keys(o[code]).length) delete o[code];
  store.set("notesMethodes", o);
}
function questionsCas(code){
  const base = ((langueMeth() === "en" ? QUESTIONS_EN : QUESTIONS_PROBABLES)[code] || []).map(x => ({ q:x[0], p:x[1], src:"base" }));
  const perso = ((store.get("questionsPerso", {}) || {})[code] || []).map((x, i) => ({ q:x.q, p:x.p || "", src:"perso", i }));
  const ia = ((store.get("questionsIA", {}) || {})[code] || []).map(x => ({ q:x.q, p:x.p || "", src:"ia" }));
  return base.concat(ia, perso);
}

/* Panneau de droite : étape sélectionnée (définition + notes), puis questions probables */
function renderPanneauQC(){
  const p = $("#qc-panneau"); if(!p) return;
  const m = METHODES.find(x => x.id === QC.affiche); if(!m){ p.innerHTML = ""; return; }
  const i = QC.etapeSel, e = i != null ? m.etapes[i] : null;
  const blocEtape = e
    ? '<section class="qc-pan-bloc"><span class="qc-pan-sur">'+tr("etapeSur")+' '+(i+1)+' '+tr("sur")+' '+m.etapes.length+'</span><h3>'+esc(e[0])+'</h3>'+
        '<p class="qc-pan-def">'+esc(e[2]||"")+'</p>'+
        '<button class="btn btn-petit" data-action="ecouterEtapeQC">'+ic("lecture")+tr("ecouter")+'</button>'+
        '<label class="champ qc-pan-note">'+tr("notes")+'<textarea id="qc-note" data-code="'+m.id+'" data-i="'+i+'" rows="5" placeholder="Un exemple de ton parcours, un chiffre réel, une formule à placer...">'+esc(noteEtape(m.id, i))+'</textarea>'+
        '<small id="qc-note-etat">Enregistré automatiquement sur cet ordinateur.</small></label></section>'
    : '<section class="qc-pan-bloc qc-pan-vide">'+ic("crayon")+'<p><b>Clique sur une étape</b> pour voir sa définition et ajouter tes notes.</p></section>';
  const qs = questionsCas(m.id);

function htmlQuestionsQC(m){
  const qs = questionsCas(m.id);
  return '<section class="qc-pan-bloc"><h3>'+tr("questions")+'</h3>'+
    '<ul class="qc-pan-q">'+qs.map(x => '<li><span class="qc-pan-q-txt">« '+esc(x.q)+' »'+
        (x.src === "ia" ? ' <span class="qc-tag">IA</span>' : x.src === "perso" ? ' <span class="qc-tag">perso</span>' : "")+'</span>'+
        (x.p ? '<span class="qc-pan-piste">'+marquer(x.p)+'</span>' : "")+

    '<details class="qc-pan-ajout"><summary>Ajouter une question</summary>'+

      '<button class="btn btn-petit btn-bleu" data-action="ajoutQuestionQC">Ajouter</button></details>'+
    (geminiActif() ? '<button class="btn btn-petit" data-action="questionsIAQC" id="qc-btn-ia">'+ic("eclair")+'D\'autres questions (IA)</button>' : '<p class="muet petit">Avec une clé Gemini active, un bouton propose d\'autres questions adaptées à ton parcours.</p>')+
  '</section>';
}
function renderQuestionsQC(){
  const z = $("#qc-questions"), m = METHODES.find(x => x.id === QC.affiche);
  if(z) z.innerHTML = m ? htmlQuestionsQC(m) : "";
}
function brancherNoteQC(){
  const t = $("#qc-note");
  if(t) t.addEventListener("input", () => {
    majNoteEtape(t.dataset.code, Number(t.dataset.i), t.value);
    const s = $("#qc-note-etat"); if(s) s.textContent = "Enregistré ✓";
    const li = document.querySelector('.qc-etapes li[data-i="'+t.dataset.i+'"]'); if(li) li.classList.toggle("a-note", !!t.value.trim());
  });
}

const PROMPT_QUESTIONS_CAS = `Tu prépares un candidat à un entretien pour un poste de Digital Analytics Consultant junior chez fifty-five (conseil en data et technologie pour le marketing). Le candidat restitue une méthode pour le cas « {TITRE} ». Étapes de sa méthode : {ETAPES}.
Génère 4 questions de relance qu'un manager poserait à l'oral sur ce cas, différentes de celles-ci : {CONNUES}. Langue des questions et des pistes : {LANGUE}.
Pour chacune, une piste de réponse en une ligne, appuyée sur la méthode. N'invente aucun chiffre, aucun outil, aucune mission absents du profil. Phrases courtes, tutoiement, aucun tiret long.
Profil du candidat : {PROFIL}
Réponds uniquement avec un objet JSON valide : { "questions": [ { "question": "...", "piste": "..." } ] }`;
async function genererQuestionsCasIA(m){
  const sys = remplir(PROMPT_QUESTIONS_CAS, { TITRE:m.titre, ETAPES:m.etapes.map(e => e[0]).join(", "), CONNUES:questionsCas(m.id).map(x => x.q).join(" | "), PROFIL:profilCandidat(), LANGUE: langueMeth() === "en" ? "anglais britannique" : "français" });
  const { obj } = await geminiJSON(sys, [{ role:"user", parts:[{ text:"Génère les questions." }] }], { temperature:0.8, delai:60000, rapide:true });
  const qs = (obj && Array.isArray(obj.questions) ? obj.questions : []).filter(x => x && typeof x.question === "string" && x.question.trim()).slice(0, 4)
    .map(x => ({ q:sansTiret(x.question.trim()), p:sansTiret(String(x.piste || "").trim()) }));
  if(!qs.length) throw new ErrGem("json", "Gemini n'a renvoyé aucune question exploitable.");
  return qs;
}

Object.assign(ACTIONS, {
  selEtapeQC(el){
    const li = el.closest("li[data-i]"); if(!li) return;
    QC.etapeSel = Number(li.dataset.i);
    $$(".qc-etapes li").forEach(x => x.classList.toggle("selection", x === li));
    $$(".qc-et-titre").forEach(b => b.setAttribute("aria-pressed", String(b.closest("li") === li)));
    renderPanneauQC();
  },
  ajoutQuestionQC(){
    const q = ($("#qc-q-new").value || "").trim(), p = ($("#qc-p-new").value || "").trim();
    if(!q){ toast("Écris d'abord la question."); return; }
    const o = store.get("questionsPerso", {}) || {}; (o[QC.affiche] = o[QC.affiche] || []).push({ q, p }); store.set("questionsPerso", o);
    renderQuestionsQC(); toast("Question ajoutée.");
  },
  supprQuestionQC(el){
    const o = store.get("questionsPerso", {}) || {}; const l = o[QC.affiche] || []; l.splice(Number(el.dataset.arg), 1);
    if(l.length) o[QC.affiche] = l; else delete o[QC.affiche]; store.set("questionsPerso", o); renderQuestionsQC();
  },
  async questionsIAQC(el){
    const m = METHODES.find(x => x.id === QC.affiche); if(!m) return;
    el.disabled = true; el.textContent = "Gemini prépare 4 questions...";
    try{
      const qs = await genererQuestionsCasIA(m);
      const o = store.get("questionsIA", {}) || {}; o[m.id] = (o[m.id] || []).concat(qs).slice(-12); store.set("questionsIA", o);
      if(QC.affiche === m.id) renderQuestionsQC();
      toast(qs.length + " questions ajoutées par Gemini.");
    }catch(e){ toast((e && e.message) || "Génération impossible."); if(document.body.contains(el)){ el.disabled = false; el.textContent = "D'autres questions (IA)"; } }
  }
});

function rLexique(){
  const cat = store.get("lexiqueCat", "tout");
  const chip = (k, l) => '<button class="chip" data-action="lexiqueCat" data-arg="'+k+'" aria-pressed="'+(cat === k)+'">'+l+'</button>';
  E().innerHTML = entete("Lexique anglais")+'<div class="contenu lexique">'+
    '<p class="muet">Anglais britannique. Touche « Écouter » pour la prononciation. Les mêmes expressions existent en flashcards (FR vers EN).</p>'+
    '<div class="flex"><button class="btn btn-bleu" data-go="module/flashcards">'+ic("cartes")+'Réviser en flashcards</button><button class="btn" data-action="lexiqueMethodesEN">'+ic("etapes")+'Méthodes en anglais</button></div>'+
    '<label class="sr" for="lex-q">Chercher</label><input id="lex-q" class="qc-champ lex-champ" placeholder="Chercher en français ou en anglais..." autocomplete="off" spellcheck="false">'+
    '<div class="flex">'+chip("tout","Tout")+CATS_LEXIQUE.map(c => chip(c[0], c[1])).join("")+chip("fauxamis","Faux amis")+'</div>'+
    '<div id="lex-liste" class="lex-liste"></div></div>';
  const q = $("#lex-q"); q.addEventListener("input", () => listeLexique(q.value));
  listeLexique("");
}
function listeLexique(recherche){
  const z = $("#lex-liste"); if(!z) return;
  const cat = store.get("lexiqueCat", "tout"), n = norm(recherche || "").trim();
  if(cat === "fauxamis"){
    z.innerHTML = '<div class="carte"><h3>Faux amis et pièges fréquents</h3><table class="tab"><thead><tr><th>Anglais</th><th>Veut dire</th><th>Attention</th></tr></thead><tbody>'+
      FAUX_AMIS.filter(f => !n || norm(f.join(" ")).includes(n)).map(f => '<tr><th lang="en">'+esc(f[0])+'</th><td>'+esc(f[1])+'</td><td>'+esc(f[2])+'</td></tr>').join("")+'</tbody></table></div>';
    return;
  }
  const l = LEXIQUE_EN.filter(x => (cat === "tout" || x.c === cat) && (!n || norm(x.en + " " + x.fr + " " + x.ex).includes(n)));
  z.innerHTML = l.length ? l.map(x => '<div class="lex-item"><div class="lex-haut"><span class="lex-en" lang="en">'+esc(x.en)+'</span>'+
      '<button class="btn-icone lex-ecoute" data-action="ecouterEN" data-t="'+esc(x.en + ". " + x.ex)+'" aria-label="Écouter : '+esc(x.en)+'">'+ic("lecture")+'</button></div>'+
      '<span class="lex-fr">'+esc(x.fr)+'</span><span class="lex-ex" lang="en">'+esc(x.ex)+'</span></div>').join("")
    : '<p class="muet">Aucune expression trouvée.</p>';
}

Object.assign(ACTIONS, {

    const f = $(".feuille-meth"); const fiche = $(".qc-fiche");
    route();
    if(f) feuilleMethode(f.dataset.id, f.classList.contains("revision"));

  },
  ecouterEN(el){ VOIX.taire(); VOIX.parler(el.dataset.t || "", "en"); },
  ecouterAnnonce(el){ const m = METHODES.find(x => x.id === el.dataset.arg); if(m){ VOIX.taire(); VOIX.parler(annonceMethode(m), langueMeth() === "en" ? "en" : "fr"); } },
  ecouterEtapeQC(el){ const m = METHODES.find(x => x.id === QC.affiche), e = m && m.etapes[QC.etapeSel]; if(e){ VOIX.taire(); VOIX.parler(e[0] + ". " + (e[2] || ""), langueMeth() === "en" ? "en" : "fr"); } },

  lexiqueMethodesEN(){ store.set("langueMethodes", "en"); appliquerLangueMethodes(); go("methodes"); }
});

const REPONSES_TYPES = {
  T7:{ fr:"Je procède en six étapes. Je cadre d'abord les destinations, les décisions à éclairer et le gain attendu, puis j'audite les événements existants, le consentement et les volumes. Je conçois le point d'entrée first-party, le conteneur serveur, les règles de filtrage et l'event_id. Je lance un pilote sur une destination et un événement, par exemple la demande confirmée, et je compare les volumes navigateur, serveur et CRM sur une période donnée. Ensuite, je bascule progressivement avec des alertes sur les volumes. Pour conclure : le server-side ne remplace ni le consentement ni la qualité du plan de marquage, il sécurise l'envoi des données et réduit les pertes.",
       en:"I'd do it in six steps. First, I scope the destinations, the decisions and the expected gain, and I check the current events, consent and volumes. Then I design the first-party endpoint, the server container, the filters and the event_id. I start a pilot with one destination and one event, like the confirmed request, and I compare browser, server and CRM volumes. Then I switch step by step, with volume alerts. Server-side doesn't replace consent: it makes data sending safer." },
  A1:{ fr:"Je procède en cinq étapes. Je cadre d'abord les parcours à tester, puis je définis les scénarios : le parcours et les événements attendus. L'agent rejoue ces scénarios et compare les volumes au back-office. Il classe les écarts, bloquants ou mineurs, et ouvre un ticket par écart ; je valide les écarts bloquants et je décide de la correction. Après la correction, je fais rejouer les scénarios pour contrôler. Pour conclure : l'agent accélère la recette, mais la décision reste humaine.",
       en:"I'd do it in five steps. First, I choose the journeys to test and define the scenarios. Then the agent replays them and compares volumes with the back office. It sorts the gaps and opens one ticket per gap, and I decide the fix for the blocking ones. After the fix, the agent replays the scenarios to check." },
  A2:{ fr:"Je cadre d'abord la baisse : périmètre, période et définition. Je confirme la source de référence. L'agent décompose la baisse, commandes et panier moyen, puis canal, appareil et page, et il classe les hypothèses selon la preuve et la probabilité. Je choisis l'hypothèse à vérifier et l'action à lancer, puis je suis son effet. Une baisse des commandes ne prouve pas un problème de tracking. Pour conclure : l'agent trie les pistes, le consultant décide de l'action.",
       en:"First, I set the scope, the period and the definition. I confirm the reference source. The agent splits the drop by orders and average order value, then by channel, device and page, and it ranks the hypotheses by evidence. I choose what to check and what to do, then I follow the effect. Fewer orders don't prove a tracking issue." },
  A3:{ fr:"Chaque semaine, un crawl liste les cookies déposés par le site. Je compare le résultat au référentiel Luciol et je repère les nouveaux cookies. L'agent propose une classification par finalité, que le DPO valide. Ensuite, je mets à jour le référentiel. Pour conclure : on automatise la veille, mais la conformité se valide.",
       en:"Every week, a crawl lists the cookies on the site. I compare it with the Luciol reference list and spot the new cookies. The agent suggests a purpose for each one. The DPO validates the classification. Then I update the reference list." },
  A4:{ fr:"Je collecte les KPI de la semaine et je les compare à la semaine précédente et à l'objectif. Je détecte les anomalies au-delà d'un seuil. Un modèle de langage rédige un premier commentaire. Je le relis avant l'envoi. Pour conclure : le modèle rédige, l'analyste valide.",
       en:"I collect the weekly KPIs and compare them with last week and the target. I flag anomalies above a threshold. A language model writes a first commentary. I review it before sending. The model writes, the analyst validates." },
  T1:{ fr:"Je procède en sept étapes. Je cadre d'abord le besoin métier et les indicateurs, puis j'audite le suivi existant. Je prépare le plan de marquage et je le fais valider par le marketing et par l'équipe technique. L'équipe technique met en place le suivi, j'organise la recette et je fais corriger les problèmes bloquants. Je valide avant la mise en production. Après le lancement, je surveille les données et je les compare au back-office quand c'est pertinent, en expliquant les écarts inattendus : le consentement et des définitions différentes en expliquent une partie. Pour conclure : le suivi est fiable quand les écarts sont connus, stables et expliqués.",
       en:"I'd do it in seven steps. First, I scope the need and the KPIs, and I audit the current tracking. Then I write the tracking plan, and marketing and the tech team sign it off. The tech team builds it, and we test and fix the blocking issues before go-live. After launch, I monitor the data and explain any gap with the back office." },
  T2:{ fr:"Pour suivre une demande d'essai ou de devis, je procède en six étapes. D'abord le déclencheur : l'événement part à la validation réelle de la demande, pas au clic sur le bouton, sinon on compte les erreurs et les doubles clics. Ensuite, un nom normalisé, par exemple demande_essai_envoyee, selon la convention du plan de marquage. J'ajoute les paramètres utiles à l'analyse, comme le modèle ou l'étape, sans aucune donnée personnelle. L'événement ne part que si l'utilisateur a accepté le consentement. Côté destinations : GA4 pour l'analyse, le CRM pour le suivi commercial. Enfin, je compare les volumes jour par jour entre l'outil d'analyse et le CRM. Pour conclure : la mesure est fiable quand les volumes suivent ceux du CRM jour après jour.",
       en:"The event fires when the form is really sent, not on the click. I give it a clear name and useful parameters, with no personal data. It only fires with consent. The data goes to GA4 for analysis and to the CRM for sales. Then I compare daily volumes in both tools." },
  T3:{ fr:"Face à un écart entre l'outil d'analyse et le CRM, je procède en sept étapes. Je prends d'abord le CRM comme référence. Je regarde si l'écart est stable, en gardant en tête qu'un écart stable n'est pas forcément juste. Je le découpe par navigateur, appareil, système et source de trafic. Si je vois une cassure nette à une date précise, c'est un bug de collecte : je le traite en priorité. Ensuite, je chiffre la part structurelle : refus de consentement et bloqueurs de publicité. Je suis quelques demandes de bout en bout, du formulaire jusqu'au CRM, pour vérifier la chaîne complète. Enfin, je fixe un seuil d'écart acceptable avec le client et je le suis dans le temps. Pour conclure : l'écart restant est expliqué, chiffré et surveillé avec un seuil.",
       en:"The CRM is my reference. I check if the gap is stable, and I split it by browser, device and source. A sharp break on one date is a tracking bug, so I fix it first. Then I measure the normal part, like consent refusals and ad blockers. I test a few leads end to end, and we agree on an acceptable gap." },
  T4:{ fr:"Après une chute suite à une mise en production, je procède en six étapes. D'abord, je liste tout ce qui a changé dans la mise en production. Je compare avant et après par navigateur, appareil et système, pour localiser la chute. Je vérifie le marquage dans TagCommander : est-ce que la balise de confirmation part toujours ? Avec Contentsquare, je regarde où les utilisateurs abandonnent dans le nouveau parcours. J'écarte les bots : ils gonflent le trafic, ils ne font pas baisser les conversions. Enfin, je fais corriger, et je vérifie que les conversions reviennent au niveau d'avant. Ma priorité est claire : d'abord savoir si c'est la mesure ou le site. Pour conclure : la chute est close quand les conversions retrouvent leur niveau d'avant la mise en production.",
       en:"First, I list what changed in the release. I compare before and after, by browser and device. Then I check the confirmation tag in TagCommander and the user journey in Contentsquare. Bots add traffic, but they don't remove conversions. We fix the issue, and I check that conversions come back." },
  T5:{ fr:"Si le volume remonté est le double de celui du CRM, je procède en sept étapes. Mon hypothèse de départ : l'événement est déclenché deux fois. Je prends le CRM comme référence pour mesurer le surplus. Au-delà de 10 % d'écart, je considère que c'est un problème de comptage, pas un écart normal. Je vérifie dans TagCommander combien de règles déclenchent l'événement. Je m'assure que la page de confirmation ne le déclenche qu'une seule fois, y compris en cas de rechargement. Je fais corriger, avec une recette avant la remise en production. Enfin, je contrôle le volume sur une semaine complète. Pour conclure : le doublon est réglé quand le volume rejoint celui du CRM sur une semaine complète.",
       en:"My first idea is that the event fires twice. I use the CRM as the reference: over a 10% gap, it's a counting issue. In TagCommander, I check the firing rules and the thank-you page. We fix it and test it. Then I check the volume for a full week." },
  T6:{ fr:"Pour mesurer à la fois une application et un site, je procède en cinq étapes. Je pars d'un plan de marquage commun : mêmes noms d'événements, mêmes paramètres. Je tiens une table de correspondance entre web et application, qui alimente le tableau de bord. Les événements propres à l'application, comme les notifications ou la navigation native, sont rattachés à des objectifs équivalents côté web. Je fais valider le plan par les équipes web et application ensemble, pour éviter deux nomenclatures. Enfin, je teste la cohérence des chiffres entre les deux supports avant de publier. Pour conclure : site et application se lisent dans un seul tableau de bord, avec les mêmes définitions.",
       en:"I use one tracking plan for the web and the app, with the same names. A mapping table links both in the dashboard. App-only events get a similar goal on the web. Both teams validate the plan. I compare the numbers before I publish." },
  C1:{ fr:"Je procède en quatre étapes. Je comprends d'abord le besoin marketing : quelle décision la donnée doit permettre. Je comprends ensuite la difficulté technique et je fais estimer l'effort. Je compare la demande initiale et les alternatives, selon leur utilité et leur coût. Enfin, je fais valider une solution et je consigne la décision. Une collecte complexe n'est pas forcément impossible : c'est une question d'effort et de priorité. Pour conclure : la solution retenue est validée, écrite, et chacun sait pourquoi.",
       en:"First, I ask marketing what decision the data will help. Then I ask the tech team what is hard and how much effort it takes. I compare the first request with other options, on value and cost. We validate one option, and I write the decision down. Complex doesn't mean impossible." },
  C2:{ fr:"Je procède en sept étapes. Je diagnostique d'abord les abandons dans le formulaire, puis je formule une hypothèse claire, par exemple qu'un formulaire plus court donnera plus de demandes confirmées. Je compare la version actuelle et une variante, avec une répartition aléatoire. Avant le lancement, je fixe la taille d'échantillon, le seuil statistique et les indicateurs. Mon indicateur principal est le taux de demandes confirmées, car un clic sur le bouton ne prouve pas qu'une demande est confirmée, et je surveille aussi la qualité des demandes. Je décide selon le résultat, son intérêt métier et la qualité. Pour conclure : on déploie seulement si le gain est démontré, utile, et sans perte de qualité.",
       en:"I start with the drop-offs in the form. My hypothesis: a shorter form gives more confirmed requests. I test the current version against a variant, with a random split. Before launch, I set the sample size, the significance level and the KPIs. My main KPI is confirmed requests, and I also watch lead quality. Then I decide on the result, the business value and the quality." },
  C3:{ fr:"On observe une hausse de +8 %, avec une p-value de 0,12, alors que le seuil fixé avant le test était 0,05. Le résultat est encourageant, mais non concluant au seuil prévu : je ne recommande pas le déploiement sur ce seul résultat. Si le test est encore en cours, je suis le plan initial, sans le prolonger jusqu'à obtenir une p-value favorable. S'il est terminé, je communique l'incertitude et j'envisage un nouveau test si l'enjeu le justifie. La p-value dit à quel point un écart comme celui-ci, ou plus extrême, serait surprenant si les deux versions étaient en réalité aussi performantes : ce n'est ni la probabilité que la variante gagne, ni celle que les versions soient identiques. Pour conclure : encourageant mais non démontré, pas de déploiement sur cette seule base.",
       en:"We see +8%, but the p-value is 0.12 and our threshold was 0.05. So it's promising, but not conclusive. I don't recommend a roll-out on this result alone. If the test is still running, we follow the plan and don't extend it just to get a better p-value. If it's finished, I explain the uncertainty, and we can run a new test if it's worth it." },
  C4:{ fr:"Avec une p-value de 0,04, je procède en six étapes. Je ne déploie pas tout de suite, même si 0,04 passe sous le seuil de 0,05. Je vérifie que la taille d'échantillon prévue est atteinte. Je contrôle les garde-fous, comme les annulations ou les rendez-vous non honorés. Je regarde l'intervalle de confiance du gain, pas seulement la p-value, pour savoir si le gain est utile en pratique. Je déploie si le gain tient après ces contrôles. Enfin, je suis l'effet réel après la mise en production, qui peut être plus faible que pendant le test. Pour conclure : le gain est confirmé quand il tient après la mise en production.",
       en:"0.04 is below our 0.05 threshold, but I don't roll out yet. I check the sample size and the guardrails, like cancellations. I look at the confidence interval to see the real size of the gain. If the gain holds, we roll out. Then I follow the effect after go-live." },
  C5:{ fr:"Face à un segment qui sous-performe, par exemple la tablette, je procède en cinq étapes. J'observe d'abord le taux plus faible sur cette résolution. Je vérifie que le volume suffit pour conclure et que le mix de trafic est comparable. Je compare ensuite par source de trafic, à résolution égale. Pour les sources, j'utilise les UTM pour les campagnes, les référents et la recherche pour le reste. Si le retard persiste à source égale, ce n'est plus le trafic : c'est la page, et on agit dessus, par exemple avec une analyse du parcours puis un test ciblé. Pour conclure : si l'écart persiste à source égale, c'est la page qu'il faut retravailler.",
       en:"I see a lower rate on tablet. First, I check we have enough data and a similar traffic mix. Then I compare by source, on the same device. If tablet is still behind, it's the page. So we look at the journey and test a fix." },
  C6:{ fr:"Pour formuler une hypothèse de test, je procède en cinq étapes, qui tiennent en une phrase. Je pars d'une observation chiffrée, tirée des données, par exemple un taux d'abandon sur un champ. Ensuite, le changement : si je modifie un élément précis de la page... Puis la mesure : alors tel indicateur va augmenter ou baisser... Puis la raison : car j'ai observé tel comportement. Et je garde une seule métrique principale pour décider, les autres servent de garde-fous. Une mauvaise hypothèse, ce serait « le bouton sera plus joli, donc les gens cliqueront plus » : ni observation, ni raison. Pour conclure : une bonne hypothèse tient en une phrase, si je change X, alors Y bouge, car Z.",
       en:"I start from the data, for example a high drop-off on one field. Then I write one sentence: if I change this, then this metric goes up, because of what users do. I keep one main metric to decide. The other metrics are guardrails." },
  C7:{ fr:"Si le taux de conversion passe de 3 % à 2,5 %, je procède en cinq étapes. Je chiffre d'abord : c'est une baisse de 0,5 point, soit environ 17 % en relatif. Première cause à vérifier : un tracking cassé, dans TagCommander, car si la mesure est fausse, tout le reste l'est aussi. Deuxième cause : la saisonnalité, en comparant à la même période l'an passé. Troisième cause : des bots, visibles par des pics de trafic inhabituels. Enfin, je chiffre le poids de chaque cause et je priorise les actions. Pour conclure : je présente la cause confirmée, son poids chiffré, et l'action prioritaire.",
       en:"From 3% to 2.5% is 0.5 percentage points, about 17% in relative terms. First, I check the tracking in TagCommander. Second, I compare with the same period last year for seasonality. Third, I look for strange traffic spikes from bots. Then I size each cause and choose the first action." },
  K1:{ fr:"Face à un client qui veut un résultat garanti, je procède en cinq étapes. Je ne garantis pas un résultat, je propose une méthode, sans lui dire qu'il se trompe. Je cadre le chiffre : passer de 3 % à 4 %, c'est +1 point, soit +33 % en relatif, ce qui est ambitieux. Je propose une démarche en étapes : audit, tests prioritaires, mise en production. On fait un point d'étape à un mois, et on vise un objectif réaliste à trois mois. Si le client lance une promotion en parallèle, on la mesure à part pour ne pas la confondre avec l'effet des optimisations. Pour conclure : pas de garantie, mais un plan, des jalons et un objectif réaliste.",
       en:"I can't promise a result, but I can offer a method. Going from 3% to 4% is +1 point, so +33% more conversions. We start with an audit, then key tests, then a roll-out. We review after one month and set a realistic goal for three months. If there's a promotion, we measure it apart." },
  K2:{ fr:"Je procède en cinq étapes. Je cadre la période, le périmètre et la définition du chiffre d'affaires, puis je vérifie la source de référence et la cohérence des données. Je regarde le nombre de commandes et la valeur moyenne par commande, et j'examine les annulations ou les retours selon la définition retenue. Enfin, je creuse le levier touché : trafic, conversion, canaux, appareils ou saisonnalité. Je n'attribue pas la baisse au tracking sans l'avoir vérifié, et je n'annonce pas de cause avant de l'avoir confirmée. Pour conclure : je distingue une vraie baisse de performance d'un problème de mesure, puis je propose l'action adaptée.",
       en:"First, I set the period, the scope and the revenue definition. I check the reference source. Then I split revenue into the number of orders and the average order value. I check cancellations and returns, and I find the driver: traffic, conversion, channels, devices or seasonality. I don't blame tracking before I check it." },
  K3:{ fr:"Pour recommander une action, je procède en cinq étapes. Je commence par la synthèse, en une phrase. Je propose un plan de trois actions au maximum, priorisées selon l'impact attendu et l'effort. Je donne les hypothèses et les limites de l'analyse : ce qu'on sait, ce qui manque encore. Je dis aussi ce qu'on ne fait pas, et pourquoi, pour que le choix soit clair. Je termine par le prochain point et la décision attendue. Pour conclure : une décision attendue, trois actions au plus, et une date pour le prochain point.",
       en:"I start with the main point, in one sentence. Then I give three actions max, in order of priority. I explain the assumptions and the limits. I also say what we won't do, and why. I end with the next meeting and the decision we need." },
  K4:{ fr:"Voici ce que nous savons : la baisse est confirmée, sur ce périmètre. Ce que nous ne savons pas encore : la cause n'est pas confirmée. En ce moment, nous vérifions [les points en cours, par exemple le tracking et les principaux canaux]. Je reviens vers vous avec une mise à jour dans [délai, par exemple deux jours]. Pour l'instant, je n'ai pas de décision à vous demander. Pour conclure : vous savez ce qui est sûr, ce qui est en cours, et quand vous aurez la suite.",
       en:"Here is what we know: the drop is confirmed, on this scope. We don't know the cause yet. Right now, we're checking [the main points, for example tracking and key channels]. I'll update you in [two days]. For now, I don't need a decision from you." },
  K5:{ fr:"Face à un client qui trouve que le site marche bien, je procède en cinq étapes. Je définis simplement le tracking : c'est ce qui remonte vos données de vente vers vos outils de pilotage. Je rassure : le site fonctionne, mais les chiffres qu'il remonte peuvent être incomplets. Je donne un exemple concret : si une vente sur dix n'est pas comptée, votre budget est piloté sur des chiffres faux. Je propose un audit en deux semaines, puis une recette avant chaque mise en production. Le bénéfice : piloter sur des données fiables. Pour conclure : des données fiables pour décider où mettre le budget.",
       en:"Your site works, but some sales data may be missing. Tracking sends your sales data to your reports. If one sale in ten is missing, your budget decisions use wrong numbers. I suggest a two-week audit, then testing before each release. That way, you can trust your numbers." },
  K6:{ fr:"Pourquoi le conseil ? Je réponds en quatre temps. D'abord une raison positive : le conseil me permet de travailler sur plusieurs marques et plusieurs secteurs. C'est la suite logique de mon parcours : côté annonceur, chez La Poste en web analyse et CRO, puis chez Cultura sur le tracking, le consentement et le reporting, et je veux maintenant appliquer cette méthode à plusieurs clients. Ce qui m'attire chez vous en particulier : le conseil, le tracking, l'expérimentation, et les secteurs automobile et mobilité. Et je ne pars pas contre mon employeur actuel : je vais vers quelque chose. Pour conclure : je veux appliquer ma méthode à plusieurs clients, dans un cabinet qui fait exactement ce métier.",
       en:"I want to work with many brands and sectors. At La Poste, I did web analytics and CRO. At Cultura, I worked on tracking, consent and reporting. Your firm does what I like: consulting, tracking, testing, automotive and mobility. I'm not running away from my job: I'm moving towards something new." }
};

const ECRANS_PALETTE = [
  ["Accueil","accueil","accueil home"], ["Entraîner","entrainer","entrainer simulation round entretien"],
  ["Progression","progression","progression stats score"], ["Modules","modules","modules"],

];

function flashTouche(touche, texte){
  let z = $("#kbd-flash");
  if(!z){ z = document.createElement("div"); z.id = "kbd-flash"; z.className = "kbd-flash"; z.setAttribute("aria-hidden", "true"); document.body.appendChild(z); }

function afficherCasLocal(code){

  QC.affiche = code;
  if(nomRoute() === "quelcas" && QC.vue === "affichage") renderAffichageQC(); else go("quelcas/affichage");

}

/* ---------- Palette ---------- */
function resultatsPalette(q){
  const n = norm(q).trim(), res = [], vus = new Set();
  const ajoutCas = m => { if(m && !vus.has(m.id)){ vus.add(m.id); res.push({ type:"cas", id:m.id, titre:m.court, sous:m.titre }); } };
  if(!n){ histoQC().forEach(x => ajoutCas(trouverItem(x.code))); MOI_ITEMS.forEach(ajoutCas); SS_ITEMS.forEach(ajoutCas); METHODES.forEach(ajoutCas); }
  else {
    METHODES.concat(MOI_ITEMS, SS_ITEMS).filter(m => norm(m.id) === n.replace(/\s+/g, "")).forEach(ajoutCas);
    METHODES.concat(MOI_ITEMS, SS_ITEMS).filter(m => norm(m.titre + " " + m.court).includes(n)).forEach(ajoutCas);
    chercherCas(q).forEach(ajoutCas);
  }
  const cas = res.slice(0, n ? 8 : 6);
  const ecrans = ECRANS_PALETTE.filter(e => !n || norm(e[0] + " " + e[2]).includes(n)).slice(0, n ? 4 : 3).map(e => ({ type:"ecran", id:e[1], titre:e[0], sous:"Écran" }));
  return cas.concat(ecrans);
}
function ouvrirPalette(){
  ouvrirModale('<div class="palette"><label class="sr" for="pal-q">Chercher un cas ou un écran</label>'+
    '<input id="pal-q" class="pal-champ" placeholder="Un cas, un mot de la question, un code (T3) ou un écran..." autocomplete="off" spellcheck="false">'+
    '<ul id="pal-res" class="pal-res" role="listbox" aria-label="Résultats"></ul>'+
    '<p class="pal-aide"><kbd>↑</kbd><kbd>↓</kbd> choisir <kbd>Entrée</kbd> ouvrir <kbd>Échap</kbd> fermer</p></div>');
  const q = $("#pal-q");
  const maj = () => { KB.palRes = resultatsPalette(q.value); KB.palSel = 0; rendrePalette(); };
  q.addEventListener("input", maj);
  q.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); KB.palSel = Math.min(KB.palRes.length - 1, KB.palSel + 1); rendrePalette(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); KB.palSel = Math.max(0, KB.palSel - 1); rendrePalette(); }
    else if(e.key === "Enter"){ e.preventDefault(); executerPalette(KB.palSel); }
  });
  maj(); setTimeout(() => q.focus(), 20);
}
function rendrePalette(){
  const ul = $("#pal-res"); if(!ul) return;
  ul.innerHTML = KB.palRes.length ? KB.palRes.map((r, i) => '<li role="option" aria-selected="'+(i === KB.palSel)+'"><button data-action="palChoix" data-arg="'+i+'">'+
      '<span class="pal-code">'+(r.type === "cas" ? esc(r.id) : ic("grille"))+'</span><span class="pal-txt"><b>'+esc(r.titre)+'</b><span>'+esc(r.sous)+'</span></span>'+
      (i === KB.palSel ? '<kbd>Entrée</kbd>' : "")+'</button></li>').join("")
    : '<li class="pal-vide">Rien trouvé. Essaie un autre mot.</li>';
  const sel = ul.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({ block:"nearest" });
}
function executerPalette(i){
  const r = KB.palRes[i]; if(!r) return;
  fermerModale();
  if(r.type === "cas"){ afficherCasLocal(r.id); flashTouche(r.id, r.titre); }

}

/* ---------- Actions de l'Affichage ---------- */
function casAffiche(){ return nomRoute() === "quelcas" && QC.vue === "affichage" ? METHODES.find(x => x.id === QC.affiche) : null; }
/* Défilement fluide fiable : on fait défiler le conteneur réel (fenêtre, feuille ou plein écran) */
function conteneurDefilant(el){
  for(let p = el.parentElement; p && p !== document.body; p = p.parentElement){
    const o = getComputedStyle(p).overflowY;
    if((o === "auto" || o === "scroll") && p.scrollHeight > p.clientHeight + 2) return p;
  }
  return null;
}
function animerDefilement(cont, cible, fin){
  const lire = () => cont ? cont.scrollTop : window.scrollY;
  const ecrire = y => { if(cont) cont.scrollTop = y; else window.scrollTo(0, y); };
  const max = cont ? cont.scrollHeight - cont.clientHeight : document.documentElement.scrollHeight - window.innerHeight;
  const depart = lire(), arrivee = Math.max(0, Math.min(max, cible)), duree = 320, t0 = performance.now();
  if(document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches || Math.abs(arrivee - depart) < 2){ ecrire(arrivee); if(fin) fin(); return; }
  const pas = t => { const k = Math.min(1, (t - t0) / duree), e = 1 - Math.pow(1 - k, 3); ecrire(depart + (arrivee - depart) * e); if(k < 1) requestAnimationFrame(pas); else if(fin) fin(); };
  requestAnimationFrame(pas);
  setTimeout(() => { if(Math.abs(lire() - arrivee) > 2){ ecrire(arrivee); } }, duree + 250); /* filet de sécurité si les images sont suspendues */
}
function defilerVers(el, mode, fin){
  const c = conteneurDefilant(el), marge = 16;
  const r = el.getBoundingClientRect();
  const haut = c ? c.getBoundingClientRect().top : 0, bas = c ? c.getBoundingClientRect().bottom : window.innerHeight;
  const actuel = c ? c.scrollTop : window.scrollY;
  if(mode === "nearest" && r.top >= haut + marge && r.bottom <= bas - marge){ if(fin) fin(); return; }
  const cible = mode === "nearest" && r.bottom > bas ? actuel + (r.bottom - bas) + marge : actuel + (r.top - haut) - marge;
  animerDefilement(c, cible, fin);
}
function choisirEtapeClavier(i){
  const li = document.querySelector('.qc-etapes li[data-i="'+i+'"]'); if(!li) return false;
  ACTIONS.selEtapeQC(li.querySelector(".qc-et-titre") || li);
  defilerVers(li, "nearest");
  return true;
}
function allerReponseType(){
  const r = document.querySelector(".feuille-meth .rep-type") || document.querySelector(".qc-affiche .rep-type");
  if(!r) return false;
  r.open = true;
  defilerVers(r, "start", () => { const s = r.querySelector("summary"); if(s) try{ s.focus({ preventScroll:true }); }catch(e){} });
  return true;
}
function naviguerHistorique(sens){
  const codes = []; histoQC().forEach(x => { if(!codes.includes(x.code)) codes.push(x.code); });
  const i = codes.indexOf(QC.affiche), j = i + (sens < 0 ? 1 : -1);
  if(i < 0 || j < 0 || j >= codes.length) return false;
  QC.affiche = codes[j]; renderAffichageQC(); return codes[j];
}

document.addEventListener("keydown", e => {
  const route = nomRoute();
  if(route === "session") return;
  const modaleOuverte = !$("#modale").classList.contains("cache");
  const k = e.key;
  /* Palette : Ctrl + K partout, / hors champ de saisie */
  if((e.ctrlKey || e.metaKey) && (k === "k" || k === "K")){ e.preventDefault(); if(!$(".palette")) ouvrirPalette(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(cibleTexte(e.target)){
    if(k === "Escape" && e.target.id === "qc-note"){ e.target.blur(); flashTouche("Échap", "Note enregistrée"); }
    if(k === "Escape" && e.target.id === "qc-rep"){ e.target.blur(); flashTouche("Échap", "Réponse gardée"); }
    return;
  }
  if(modaleOuverte){
    if((k === "r" || k === "R") && $(".feuille-meth") && allerReponseType()){ e.preventDefault(); flashTouche("R", "Réponse type"); }
    return;
  }
  if(k === "/"){ e.preventDefault(); ouvrirPalette(); return; }
  if(k === "?"){ e.preventDefault(); ouvrirAideClavier(); return; }
  if(route !== "quelcas" && route !== "methodes") return;
  if(route === "quelcas" && QC.vue !== "affichage") return;
  /* Codes : lettre puis chiffre */
  const lettre = k.length === 1 ? k.toUpperCase() : "";
  if(KB.combo && /^[1-9]$/.test(k)){
    const code = KB.combo + k; KB.combo = null; clearTimeout(KB.comboT);
    e.preventDefault();
    if(trouverItem(code)){
      flashTouche(code, libelleCas(code));
      if(route === "methodes") feuilleMethode(code, false); else afficherCasLocal(code);
    } else flashTouche(code, "Ce code n'existe pas");
    return;
  }
  if(["T","C","A","M","S"].includes(lettre) || (lettre === "K" && !e.shiftKey)){
    KB.combo = lettre; clearTimeout(KB.comboT); KB.comboT = setTimeout(() => { KB.combo = null; }, 1600);
    flashTouche(lettre + " _", "Tape le chiffre"); return;
  }
  if(route !== "quelcas") return;
  const m = casAffiche(); if(!m) return;
  const nb = m.etapes.length, sel = QC.etapeSel;
  if(k === "ArrowDown"){ e.preventDefault(); choisirEtapeClavier(sel == null ? 0 : Math.min(nb - 1, sel + 1)); flashTouche("↓", tr("etapeSur") + " " + (QC.etapeSel + 1)); return; }
  if(k === "ArrowUp"){ e.preventDefault(); choisirEtapeClavier(sel == null ? 0 : Math.max(0, sel - 1)); flashTouche("↑", tr("etapeSur") + " " + (QC.etapeSel + 1)); return; }
  if(/^[1-9]$/.test(k)){ if(Number(k) <= nb){ e.preventDefault(); choisirEtapeClavier(Number(k) - 1); flashTouche(k, m.etapes[Number(k) - 1][0]); } return; }
  if(k === " "){
    e.preventDefault();
    if(sel == null) choisirEtapeClavier(0);
    const b = document.querySelector('.qc-etapes li[data-i="'+QC.etapeSel+'"] .qc-info-inline'); if(b){ ACTIONS.defEtapeQC(b); flashTouche("Espace", "Définition"); }
    return;
  }
  if(lettre === "N"){ e.preventDefault(); if(sel == null) choisirEtapeClavier(0); const t = $("#qc-note"); if(t){ t.focus(); flashTouche("N", tr("notes")); } return; }
  if(lettre === "R"){ e.preventDefault(); if(allerReponseType()) flashTouche("R", "Réponse type"); return; }
  if(lettre === "L"){
    e.preventDefault();
    if(sel != null){ ACTIONS.ecouterEtapeQC(); flashTouche("L", tr("ecouter")); }
    else { VOIX.taire(); VOIX.parler(reponseType(m.id), langueMeth() === "en" ? "en" : "fr"); flashTouche("L", "Réponse type"); }
    return;
  }
  if(k === "ArrowLeft" || k === "ArrowRight"){
    e.preventDefault();
